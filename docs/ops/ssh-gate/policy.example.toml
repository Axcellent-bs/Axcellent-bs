# ax-gate 정책 예시 — 서버에는 /etc/ax-gate/policy.toml (root:root 644) 로 둔다.
#
# 이 파일의 값은 전부 가짜 예시이거나 자리표시자("TODO")다. 실제 서버 값(경로, 서비스 이름, 주소,
# 계정 이름, 배포 환경변수 등)은 공개 레포에 두지 않고, 서버 책임자가 비공개로 관리하는 정책 파일에 적는다.
#
# 이 파일을 바꾸는 것은 권한 정책 변경이다. 게이트로는 못 바꾸고 서버 책임자가 서버에서 직접 바꾼다.
# 비밀값을 적지 않는다.
#
# 문법은 TOML 의 좁은 부분집합이다. 게이트(bash)가 직접 읽기 때문에 아래 꼴만 된다.
#   [구역]   키 = "글"   키 = 123   키 = true   키 = ["a", "b"]  (목록은 한 줄)
# 모르는 줄이 하나라도 있으면 게이트는 모든 요청을 거부한다(안전한 쪽으로 실패).

[gate]
label = "server"      # 알림 문안 맨 앞에 붙는 이름(영어·숫자·-_)

# OS 계정 → 허용 동작. 신원은 서버의 개인 계정(실제 로그인 사용자)이다.
# 동작: status lock unlock nginx-restore nginx-add-location nginx-approve-location
#       deploy-bundle restart-backend rollback-bundle record-pr
#
# 단계 예시:
#   모두        status, deploy-bundle(자동 배포가 막혔을 때의 수동 처리), record-pr
#   권한자      위 + nginx(복원·제안·승인) + 재시작 + 롤백 + 잠금
# 계정 이름은 서버에 만든 계정명과 글자까지 같아야 한다(여기 이름은 예시).
[permissions]
authorized-1 = ["status", "lock", "unlock", "nginx-restore", "nginx-add-location", "nginx-approve-location", "deploy-bundle", "restart-backend", "rollback-bundle", "record-pr"]
authorized-2 = ["status", "lock", "unlock", "nginx-restore", "nginx-add-location", "nginx-approve-location", "deploy-bundle", "restart-backend", "rollback-bundle", "record-pr"]
authorized-3 = ["status", "lock", "unlock", "nginx-restore", "nginx-add-location", "nginx-approve-location", "deploy-bundle", "restart-backend", "rollback-bundle", "record-pr"]
# 표에 없는 계정(나머지 팀원. 게이트를 부를 수 있는 것은 게이트 그룹에 든 계정뿐이다)
_default = ["status", "deploy-bundle", "record-pr"]

# nginx-add-location / nginx-approve-location: 계정별로 열 수 있는 경로 접두.
# 제안자와 승인자 둘 다 그 접두를 갖고 있어야 적용된다. 여기 없는 계정은 location 을 못 연다.
# 접두는 "/" 로 끝내는 것을 권한다(조각 경계에서만 맞는다). 좁힐수록 안전하다.
[location_prefixes]
authorized-1 = ["/example-api/api/items/"]
authorized-2 = ["/example-api/api/items/"]
authorized-3 = ["/example-api/api/items/"]

# 첫 경로 조각 → 업스트림 포트(127.0.0.1 고정). 요청하는 사람은 포트를 고르지 못한다.
[location_upstreams]
example-api = 8201

[location]
allowed_methods = ["POST"]   # POST PUT PATCH DELETE 중에서. GET/HEAD 는 게이트로 열지 않는다
proposal_ttl_hours = 24      # 제안이 승인을 기다릴 수 있는 시간
# location 블록 안에 들어가는 지시어 줄. 서버의 기존 설정과 같은 모양이 되게 적는다.
# 자리표시: {method} {segment} {port}. 메서드 제한 한 줄과 "proxy_pass http://127.0.0.1:{port};" 한 줄은 필수다.
block_lines = ["limit_except {method} { deny all; }", "rewrite ^/{segment}/(.*)$ /$1 break;", "proxy_pass http://127.0.0.1:{port};", "include snippets/example-proxy.conf;", "include snippets/example-auth.conf;"]

[lock]
default_hours = 4     # lock 에 해제시각을 안 적었을 때 잠그는 시간
max_hours = 24        # 한 번에 잠글 수 있는 최대 시간
auto_expire = true    # true 면 해제시각이 지난 잠금은 막지 않는다. false 면 unlock 할 때까지 막는다

[deploy]
user = "deploy"                 # 배포 스크립트와 git 을 돌리는 계정(root 는 안 된다)
allowed_branches = ["dev"]      # 이 중 하나에 들어간 커밋만 받는다. 게이트는 origin/<이름> 을 본다. 비우면 전부 거부
ref_env = "DEPLOY_REF"          # 배포할 커밋(SHA)을 배포 스크립트에 넘기는 환경변수 이름
# 배포 스크립트에 넘기는 그 밖의 환경변수. 게이트가 고정한다(요청하는 사람이 못 바꾼다).
env = ["APP_PUBLIC_MARK=placeholder-a"]
env_b = ["DEPLOY_WEB_ROOT=TODO"]              # 두 번째 번들 폴더(web_root_b)에만 더 넘기는 것
required_strings = ["placeholder-a"]          # 번들에 반드시 들어 있어야 하는 표시 문자열
secret_env_files = ["TODO"]                   # 여기 적힌 env 파일들의 값(12자 이상)이 번들에 있으면 실패
bundle_allowed_env_names = []                 # 위 검사의 예외: 배포 스크립트가 일부러 번들에 넣는 값의 변수 이름
check_url = "http://127.0.0.1:8300/"          # 배포 뒤 200 이어야 하는 주소(선택)

[restart]
unit = "example-backend"        # 재시작할 서비스
health_timeout_seconds = 180    # 다시 뜰 때까지 기다리는 최대 시간(폴링)
poll_seconds = 5
backup_sqlite = []              # 재시작 전에 백업할 sqlite 파일(전체 경로)
backup_files = []               # 재시작 전에 복사해 둘 파일
backup_dirs = []                # 재시작 전에 묶어 둘 폴더

[health]
urls = ["http://127.0.0.1:8201/health"]   # 전부 200 이어야 정상. status 와 restart-backend 가 쓴다

[status]
urls = ["http://127.0.0.1:8300/"]         # status 가 응답 코드만 보여 주는 주소

# 서버 경로. 전부 자리표시자다. "TODO" 인 동안 그 경로가 필요한 동작은 실패한다.
[paths]
repo = "TODO"               # 서버의 레포 체크아웃
deploy_script = "TODO"      # 배포 스크립트
web_root_parent = "TODO"    # 번들 폴더들의 부모. 번들 교체는 이 바로 아래에서만 한다
web_root_a = "TODO"         # 첫 번째 번들 폴더
web_root_b = "TODO"         # 두 번째 번들 폴더(없으면 줄을 지운다)
backup_dir = "TODO"         # 백업을 두는 폴더
nginx_conf = "TODO"         # 게이트가 다루는 nginx 설정 파일
nginx_backup_dir = "TODO"   # nginx 설정 백업 폴더들의 부모
ops_copy_file = "TODO"      # (선택) 운영 사본 파일. 변경 뒤 갱신하고 status 가 비교한다
repo_nginx_copy = "TODO"    # (선택) 레포 체크아웃 안의 사본. status 가 비교한다
