# ax-gate 정책 예시 — 서버에는 /etc/ax-gate/policy.toml (root:root 644) 로 둔다.
#
# 이 파일의 값은 전부 가짜 예시이거나 자리표시자("TODO")다. 실제 서버 값(경로, 서비스 이름, 주소,
# 계정 이름, 배포 환경변수 등)은 공개 레포에 두지 않고, 서버 책임자가 비공개로 관리하는 정책 파일에 적는다.
#
# 이 파일을 바꾸는 것은 권한 정책 변경이다. 게이트로는 못 바꾸고 서버 책임자가 서버에서 직접 바꾼다.
# 비밀값을 적지 않는다.
#
# 문법은 TOML 의 좁은 부분집합이다. 게이트(bash)가 직접 읽기 때문에 아래 꼴만 된다.
#   [구역]   키 = "글"   키 = 123   키 = true   키 = ["a", "b"]  (목록은 한 줄)
# 모르는 줄이 하나라도 있으면 게이트는 모든 요청을 거부한다(안전한 쪽으로 실패).

[gate]
label = "server"      # 알림 문안 맨 앞에 붙는 이름(영어·숫자·-_)

# OS 계정 → 허용 동작. 신원은 서버의 개인 계정(실제 로그인 사용자)이다.
# 동작: status lock unlock nginx-restore nginx-add-location nginx-approve-location
#       deploy-bundle restart-backend rollback-bundle record-pr
#       gateway-allow-propose gateway-allow-approve gateway-allow-restore (게이트웨이 허용 목록. 아래 [gateway_allow]. 권한자 줄에
#       직접 더한다. _default 에는 둘 수 없다)
#       autodeploy-pause autodeploy-resume (자동 배포 정지·재개. 쓰려면 권한자 줄에 직접 더한다.
#       _default 에는 둘 수 없다: 넣으면 게이트가 정책을 거부한다)
#
# 단계 예시:
#   모두        status, deploy-bundle(자동 배포가 막혔을 때의 수동 처리), record-pr
#   권한자      위 + nginx(복원·제안·승인) + 재시작 + 롤백 + 잠금
# 계정 이름은 서버에 만든 계정명과 글자까지 같아야 한다(여기 이름은 예시).
[permissions]
authorized-1 = ["status", "lock", "unlock", "nginx-restore", "nginx-add-location", "nginx-approve-location", "deploy-bundle", "restart-backend", "rollback-bundle", "record-pr"]
authorized-2 = ["status", "lock", "unlock", "nginx-restore", "nginx-add-location", "nginx-approve-location", "deploy-bundle", "restart-backend", "rollback-bundle", "record-pr"]
authorized-3 = ["status", "lock", "unlock", "nginx-restore", "nginx-add-location", "nginx-approve-location", "deploy-bundle", "restart-backend", "rollback-bundle", "record-pr"]
# 표에 없는 계정(나머지 팀원. 게이트를 부를 수 있는 것은 게이트 그룹에 든 계정뿐이다)
_default = ["status", "deploy-bundle", "record-pr"]

# nginx-add-location / nginx-approve-location: 계정별로 열 수 있는 경로 접두.
# 제안자와 승인자 둘 다 그 접두를 갖고 있어야 적용된다. 여기 없는 계정은 location 을 못 연다.
# 접두는 "/" 로 끝내는 것을 권한다(조각 경계에서만 맞는다). 좁힐수록 안전하다.
[location_prefixes]
authorized-1 = ["/example-api/api/items/"]
authorized-2 = ["/example-api/api/items/"]
authorized-3 = ["/example-api/api/items/"]

# 첫 경로 조각 → 업스트림 포트(127.0.0.1 고정). 요청하는 사람은 포트를 고르지 못한다.
[location_upstreams]
example-api = 8201

# 셀프 승인(선택). 기본은 빈 목록 = 제안한 사람은 자기 제안을 승인할 수 없다(둘 이상 확인).
# 여기에 적은 계정만 자기가 제안한 location 을 직접 승인할 수 있다. 그 밖의 검증(허용 접두, 정규식 검증기,
# 제안 유효시간, 확인값, 백업 → nginx -t → reload)은 그대로 적용되고 감사 로그 note 에 self-approve:yes 가 남는다.
# 이 값은 위험을 받아들이는 서버 책임자의 결정이다: 이 계정의 키 하나가 새면 단독으로 쓰기 경로를 열 수 있다.
# 계정은 [permissions] 에 있어야 한다. 키 이름 오타·문자열이 아닌 값·없는 계정이면 정책 로드가 실패한다(전체 거부).
[self_approve]
accounts = []   # 예: ["authorized-1", "authorized-2"]

[location]
allowed_methods = ["POST"]   # POST PUT PATCH DELETE 중에서. GET/HEAD 는 게이트로 열지 않는다
proposal_ttl_hours = 24      # 제안이 승인을 기다릴 수 있는 시간
# location 블록 안에 들어가는 지시어 줄. 서버의 기존 설정과 같은 모양이 되게 적는다.
# 자리표시: {method} {segment} {port}. 메서드 제한 한 줄과 "proxy_pass http://127.0.0.1:{port};" 한 줄은 필수다.
block_lines = ["limit_except {method} { deny all; }", "rewrite ^/{segment}/(.*)$ /$1 break;", "proxy_pass http://127.0.0.1:{port};", "include snippets/example-proxy.conf;", "include snippets/example-auth.conf;"]

# 프로필(선택): location 블록 끝에 덧붙는 지시어 묶음에 이름을 붙여 둔다. 요청하는 사람은 이름만 고른다
#   nginx-add-location <이름> POST <정규식> <프로필이름>
# 쓸 수 있는 지시어는 검증기가 정한 타임아웃·본문 크기 계열뿐이다:
#   proxy_read_timeout proxy_send_timeout proxy_connect_timeout send_timeout client_body_timeout (1초~3600초, 단위 s/m)
#   client_max_body_size (1k~1024m, 단위 k/m. 0=무제한은 안 된다)
# 그 밖의 지시어(proxy_pass, include, rewrite, add_header 등)를 적으면 그 프로필을 쓰는 제안이 거부된다.
# block_lines 에 이미 있는 지시어도 프로필에 넣을 수 없다. 프로필 이름은 영어 소문자·숫자·-.
[location_profiles]
long-timeout = ["proxy_read_timeout 300s;", "proxy_send_timeout 300s;"]
big-body = ["client_max_body_size 50m;"]

# 추가 nginx 대상 파일(선택). 이 구역이 없으면 [paths] nginx_conf 하나만 다룬다(예전과 같다).
# 적으면 nginx-add-location 승인과 nginx-restore 가 대상 전부를 한 묶음으로 바꾼다:
#   전부 사전 검증 → 전부 백업 → 전부 교체 → nginx -t 한 번 → reload. 어느 단계든 실패하면 전부 되돌린다.
# 요청하는 사람은 대상을 고르지 못한다. 대상 파일마다 삽입 표시 줄(# AX-GATE-INSERT-BELOW)이 한 개씩 있어야 한다.
# 이름은 영어 소문자·숫자·-. 값은 전체 경로. 쓰려면 아래 두 줄의 주석을 풀고 경로를 채운다.
# [nginx_targets]
# site-b = "TODO"

# 대상별 블록 줄(선택). 그 대상의 기존 location 모양이 [location] block_lines 와 다를 때만 적는다.
# 없으면 그 대상도 [location] block_lines 를 쓴다. 이름은 [nginx_targets] 에 있어야 한다. 규칙은 block_lines 와 같다.
# [nginx_target_block_lines]
# site-b = ["limit_except {method} { deny all; }", "proxy_pass http://127.0.0.1:{port};", "include snippets/example-proxy-b.conf;"]

# 게이트웨이 허용 목록(선택): gateway-allow-propose → gateway-allow-approve (다른 권한자). 되돌리기는 gateway-allow-restore.
# 쓰려면 [permissions] 의 권한자 줄에 "gateway-allow-propose", "gateway-allow-approve", "gateway-allow-restore" 를 직접 더한다
# (예시 표에는 일부러 넣지 않았다. _default 에는 둘 수 없다: 넣으면 게이트가 정책을 거부한다).
# 승인은 제안자와 다른 권한자만 한다. 같은 사람은 [self_approve] accounts 에 든 계정만(nginx 와 같은 목록을 쓴다).
# 승인 시점에 다시 검증한다: skill 이름(^[a-z][a-z0-9_]{1,63}$), 중복 거부, 카드에 그 skill id 가 있을 것,
# 카드 grade 가 read 일 것(write 는 자동 거부), (requester 를 적었다면) 카드 allowed_requesters 에 그 이름이 있을 것.
# 값은 전부 자리표시자("TODO")다. 서버의 실제 위치·형식은 서버 책임자가 비공개 정책에 적는다. 이 구역의 키는 아래 일곱뿐이고, 일곱 중 requester 만 선택이다.
# 필수 값이 하나라도 비었거나 "TODO" 면 gateway-allow-* 동작은 전부 거부된다(예시 그대로 두면 아무것도 열리지 않는다).
# 카드는 작업 트리 파일이 아니라 card_repo 의 expected_card_sha 커밋 속 내용(git cat-file)으로 읽는다. 허용 목록 폴더, backup_dir 와 그 부모는 root 소유(그룹·기타 쓰기 금지)여야 한다.
# 허용 목록 파일 형식은 "한 줄에 skill 하나"(빈 줄과 # 줄은 무시)로 가정한다. 서버 형식이 다르면 gateway_allow_check.py 의 어댑터만 바꾼다.
[gateway_allow]
list_file = "TODO"        # 게이트웨이의 허용 목록 파일(전체 경로, 일반 파일). 백업 → 임시 파일 → mv 로 교체한다
card_path = "TODO"        # 대상 에이전트 카드 JSON 파일(전체 경로). card_repo 안에 있어야 하고, 그 커밋에 들어 있어야 한다
reload_cmd = "TODO"       # 반영 명령(낱말을 공백으로 나눠 그대로 실행한다. 셸을 거치지 않는다. 예: systemctl reload <게이트웨이 서비스>)
backup_dir = "TODO"       # 허용 목록 백업 폴더들의 부모(미리 만들어 둔다. gwa-... 폴더가 생긴다)
# requester = "TODO"      # (선택) 게이트웨이 요청자 이름. 적으면 카드 allowed_requesters 에 있어야 한다(카드에 목록이 없어도 거부)
card_repo = "TODO"        # (필수) 카드가 든 서버 레포 체크아웃(끝에 / 없이). card_path 가 그 안에 있어야 한다
expected_card_sha = "TODO"  # (필수) 승인된 레포 HEAD(40자 소문자 SHA). card_repo 의 HEAD 가 이 값과 같아야 하고, 카드는 이 커밋의 내용으로 읽는다

[lock]
default_hours = 4     # lock 에 해제시각을 안 적었을 때 잠그는 시간
max_hours = 24        # 한 번에 잠글 수 있는 최대 시간
auto_expire = true    # true 면 해제시각이 지난 잠금은 막지 않는다. false 면 unlock 할 때까지 막는다

[deploy]
user = "deploy"                 # 배포 스크립트와 git 을 돌리는 계정(root 는 안 된다)
allowed_branches = ["dev"]      # 이 중 하나에 들어간 커밋만 받는다. 게이트는 origin/<이름> 을 본다. 비우면 전부 거부
ref_env = "DEPLOY_REF"          # 배포할 커밋(SHA)을 배포 스크립트에 넘기는 환경변수 이름
# 배포 스크립트에 넘기는 그 밖의 환경변수. 게이트가 고정한다(요청하는 사람이 못 바꾼다).
env = ["APP_PUBLIC_MARK=placeholder-a"]
env_b = ["DEPLOY_WEB_ROOT=TODO"]              # 두 번째 번들 폴더(web_root_b)에만 더 넘기는 것
required_strings = ["placeholder-a"]          # 번들에 반드시 들어 있어야 하는 표시 문자열
secret_env_files = ["TODO"]                   # 여기 적힌 env 파일들의 값(12자 이상)이 번들에 있으면 실패
bundle_allowed_env_names = []                 # 위 검사의 예외: 배포 스크립트가 일부러 번들에 넣는 값의 변수 이름
check_url = "http://127.0.0.1:8300/"          # 배포 뒤 200 이어야 하는 주소(선택)

# 자동 배포 정지·재개(선택). 이 구역이 없으면 autodeploy-pause / autodeploy-resume 는 설정 오류로 멈춘다.
# 게이트는 pause_file 한 파일만 쓴다(root 소유 644). 자동 배포의 타이머·서비스·스크립트는 건드리지 않는다.
# 서버의 자동 배포 스크립트가 맨 앞에서 그 파일을 읽고 건너뛰게 한 번 연결해야 한다(INSTALL.md, 동봉한 autodeploy-paused.sh).
# 파일 이름은 반드시 autodeploy.pause 여야 하고 폴더는 미리 만들어 둔다. 재개시각이 지나면 저절로 재개된다.
# 쓰려면 아래 네 줄의 주석을 풀고 경로를 채운다. 이 구역의 키는 이 셋뿐이다(다른 키가 있으면 게이트가 정책을 거부한다).
# [autodeploy]
# pause_file = "TODO"   # 예: <게이트 상태 폴더>/autodeploy.pause
# default_hours = 2     # 재개시각을 안 적었을 때 멈추는 시간
# max_hours = 12        # 한 번에 멈출 수 있는 최대 시간

[restart]
unit = "example-backend"        # 재시작할 서비스
# restart-backend 의 SHA 가 서버 코드보다 앞서 있을 때(head-mismatch): false 면 "먼저 deploy-bundle" 안내만 하고 멈춘다.
# true 면 그 계정에 deploy-bundle 권한도 있을 때에 한해 번들 배포를 먼저 하고 이어서 재시작한다.
deploy_first = false
health_timeout_seconds = 180    # 다시 뜰 때까지 기다리는 최대 시간(폴링)
poll_seconds = 5
backup_sqlite = []              # 재시작 전에 백업할 sqlite 파일(전체 경로)
backup_files = []               # 재시작 전에 복사해 둘 파일
backup_dirs = []                # 재시작 전에 묶어 둘 폴더
# 백업 보관 개수. 적지 않으면(기본) 백업을 하나도 지우지 않는다. 2 이상의 정수만 쓸 수 있다(1·0·글자는 정책 오류).
# 적으면 restart-backend 가 백업을 성공적으로 끝낸 뒤, 위 backup_dirs·backup_sqlite 에 적힌 원본의 게이트 백업 세트
# (<이름>.bak-before-<SHA 8자>[.시각]의 .tgz / -sqlite / sqlite 파일 사본)를 최신 N세트만 남기고 지운다.
# 이번에 만든 세트와 직전 세트는 N 과 상관없이 남는다. 번들 백업(www-*), .env 백업, deploy-* 파일은 건드리지 않는다.
# backup_keep = 5

[health]
urls = ["http://127.0.0.1:8201/health"]   # 전부 200 이어야 정상. status 와 restart-backend 가 쓴다

[status]
urls = ["http://127.0.0.1:8300/"]         # status 가 응답 코드만 보여 주는 주소

# 서버 경로. 전부 자리표시자다. "TODO" 인 동안 그 경로가 필요한 동작은 실패한다.
[paths]
repo = "TODO"               # 서버의 레포 체크아웃
deploy_script = "TODO"      # 배포 스크립트
web_root_parent = "TODO"    # 번들 폴더들의 부모. 번들 교체는 이 바로 아래에서만 한다
web_root_a = "TODO"         # 첫 번째 번들 폴더
web_root_b = "TODO"         # 두 번째 번들 폴더(없으면 줄을 지운다)
backup_dir = "TODO"         # 백업을 두는 폴더
nginx_conf = "TODO"         # 게이트가 다루는 nginx 설정 파일
nginx_backup_dir = "TODO"   # nginx 설정 백업 폴더들의 부모
ops_copy_file = "TODO"      # (선택) 운영 사본 파일. 변경 뒤 갱신하고 status 가 비교한다
repo_nginx_copy = "TODO"    # (선택) 레포 체크아웃 안의 사본. status 가 비교한다
