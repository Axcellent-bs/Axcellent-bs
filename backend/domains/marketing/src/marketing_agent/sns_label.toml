# SNS 게시물 AI 라벨 오버레이 설정. 문구·위치·크기·표시 시간·글꼴·화질은 모두 이 파일에서만 바꾼다.
# 다른 파일을 쓰려면 환경변수 MARKETING_SNS_LABEL_CONFIG에 경로를 준다.
#
# [확인 필요 — 팀·변호사 승인]
#   아래 문구·크기·위치는 임시값이다. 확정 문구가 아니다. 인공지능기본법 제31조·시행령 제23조,
#   과기정통부 투명성 가이드라인 본문, 표시광고법 심사지침을 확인한 뒤 팀·변호사가 정한다.
#   (설계 문서 sns-design.md 10절 4번)

[text]
status = "임시 — [확인 필요 — 팀·변호사 승인]"
video = "이 영상과 글은 AI로 만들었습니다 · 캣북스는 시연용 가상 서비스입니다"
image = "이 이미지와 글은 AI로 만들었습니다 · 캣북스는 시연용 가상 서비스입니다"

[layout]
position = "bottom"        # top | center | bottom
margin_ratio = 0.06        # 위·아래 여백 = 높이 x 이 값
side_margin_ratio = 0.05   # 좌우 여백 = 너비 x 이 값
font_size_ratio = 0.032    # 글자 크기 = 높이 x 이 값
min_font_px = 16
char_width_factor = 1.0    # 한글 한 글자 폭 = 글자 크기 x 이 값 (줄바꿈 계산용)
line_spacing_px = 6

[style]
font_color = "white"
box_color = "black"
box_opacity = 0.65
box_border_ratio = 0.2     # 글자 뒤 배경 상자 안쪽 여백 = 글자 크기 x 이 값

[display]
time = "full"              # 영상은 전 구간 표시(방침). 다른 값은 아직 받지 않는다

[font]
# file이 비어 있지 않으면 그 글꼴만 쓴다(없으면 오류). 비어 있으면 아래 후보를 차례로 찾는다.
# 환경변수 MARKETING_SNS_LABEL_FONT가 있으면 그것이 우선이다. 한글이 들어 있는 글꼴이어야 한다.
file = ""
candidates = [
  "/usr/share/fonts/truetype/nanum/NanumGothic.ttf",
  "/usr/share/fonts/truetype/noto/NotoSansCJK-Regular.ttc",
  "/usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc",
  "/usr/share/fonts/noto-cjk/NotoSansCJK-Regular.ttc",
  "/usr/share/fonts/google-noto-cjk/NotoSansCJK-Regular.ttc",
  "/System/Library/Fonts/AppleSDGothicNeo.ttc",
  "C:/Windows/Fonts/malgun.ttf",
]

[output]
jpeg_quality = 92          # 1~100 (이미지는 오버레이 뒤 JPEG로 저장)
video_crf = 20             # x264 화질(낮을수록 좋음)
video_preset = "medium"
ffmpeg_timeout_s = 600
