# 이미지·영상 장면 템플릿. 프롬프트는 자유 입력이 아니다:
#   프롬프트 = 템플릿의 고정 문장 + 아래 화이트리스트 필드 치환.
# 글자(제목·가격·AI 라벨)는 모델에 그리지 않는다. 오버레이로 넣는다(다른 단계 담당).
# 문장에 들어 있는 "no text ..." 는 모델이 임의 글자를 그리지 않게 하는 고정 문구다.
# 템플릿 문장은 사람이 검토해 바꾼다. 장면 문구는 자체 제작 가상 캐릭터만 쓴다(cat_* = 캣북스 고양이,
# plan_story_video = 회사 [brand] 주인공을 기획 plan_* 필드로 받는다).

[rules]
# 필드 값 검사용 금칙어. 영문은 단어 경계로, 한글은 부분 일치로 찾는다 (소문자 기준)
text_request_words = [
  "text", "word", "words", "letter", "letters", "caption", "title", "slogan", "headline",
  "logo", "watermark", "sign", "signage", "writing", "written", "saying", "says", "typography",
  "글자", "문구", "텍스트", "자막", "제목", "로고", "간판", "워터마크", "슬로건",
]
person_words = [
  "celebrity", "famous", "lookalike", "look-alike", "portrait of", "real person", "politician",
  "닮은", "유명인", "연예인", "정치인", "실존",
]
brand_words = [
  "nike", "adidas", "apple", "google", "samsung", "disney", "pixar", "ghibli", "marvel",
  "starbucks", "coca-cola", "netflix", "youtube", "instagram", "kakao", "naver", "yes24",
  "kyobo", "aladin", "harry potter", "삼성", "애플", "디즈니", "지브리", "카카오", "네이버",
  "교보", "알라딘", "스타벅스", "해리포터",
]
# 개인정보·식별자 패턴 (필드 값에서 하나라도 걸리면 거절)
pii_patterns = [
  '\b01[016789][-. ]?\d{3,4}[-. ]?\d{4}\b',   # 휴대전화
  '\b0\d{1,2}[-. ]\d{3,4}[-. ]\d{4}\b',       # 지역번호 전화
  '[\w.+-]+@[\w-]+\.[\w.-]+',                  # 이메일
  '\b\d{6}[- ]?[1-4]\d{6}\b',                  # 주민등록번호 꼴
  '(?i)\b(buy|ord|order|pay|cus|usr|user|cpn)_[\w-]+',  # 구매자·주문·결제 식별자
  '\d{6,}',                                    # 긴 숫자열(계좌·주문번호 등)
  '(?i)https?://|www\.',                       # 외부 주소
  '주문|문의|환불|구매자|고객',                 # 고객 원문에서 온 말
]

# ---- 기획 데이터 반영(영상 템플릿만, `{plan_clause}` 자리). 고정 틀은 그대로 두고 기획안의
# 구조화 필드(핵심 메시지·근거·타깃·상품·분류·방향·유행 이름)만 정리해서 끼운다.
# 기획 글 통째 삽입 금지: 값마다 특수문자·숫자 제거 + 길이 상한 + 아래 금칙어 검사.
# 걸린 값은 거절하지 않고 그 필드만 뺀다(영상은 기존 문장대로 만들어진다). 비면 문구 전체가 빠진다.
[plan]
intro = " Story theme guidance for mood and subject only, never to be drawn as text:"
tone_map = { ride_trend = "lively and timely", own_trend = "fresh and original", with_product = "warm and product focused" }

# 11/22 기획 영상 제작안(video_plan) 경로: 회사 [brand] 주인공·배경 + 콘셉트 + 장면 프롬프트(최대 4).
# 문구에 숫자를 쓰지 않는다(값의 숫자는 지운다). 영상 프롬프트 길이 상한을 넘으면 뒤 장면부터 뺀다
[plan.field.plan_character]
max_len = 80
phrase = " Main character: {value};"
[plan.field.plan_setting]
max_len = 80
phrase = " Setting: {value};"
[plan.field.plan_concept]
max_len = 160
phrase = " concept {value};"
[plan.field.plan_scene_1]
max_len = 160
phrase = " scene one {value};"
[plan.field.plan_scene_2]
max_len = 160
phrase = " scene two {value};"
[plan.field.plan_scene_3]
max_len = 160
phrase = " scene three {value};"
[plan.field.plan_scene_4]
max_len = 160
phrase = " scene four {value};"
[plan.field.plan_idea]
max_len = 60
phrase = " core message {value};"
[plan.field.plan_why]
max_len = 60
phrase = " supporting reason {value};"
[plan.field.plan_evidence]
max_len = 80
phrase = " evidence topics {value};"
[plan.field.plan_target]
max_len = 40
phrase = " intended for readers of {value};"
[plan.field.plan_products]
max_len = 50
phrase = " featuring books about {value};"
[plan.field.plan_category]
max_len = 30
phrase = " content category {value};"
[plan.field.plan_tone]
phrase = " tone {value};"
[plan.field.plan_trends]
max_len = 80
phrase = " inspired by the trend named {value};"

[plan_rules]
# 광고법(과장·단정)·프롬프트 주입 금칙어. 걸리면 그 필드를 뺀다
ad_words = [
  "best", "no.1", "number one", "guaranteed", "guarantee", "cure", "free", "cheapest", "only",
  "최고", "1위", "최저가", "무조건", "보장", "완치", "유일", "최초", "100%", "공짜", "특효",
]
injection_words = [
  "ignore", "instruction", "instructions", "system", "prompt", "assistant", "override", "jailbreak",
  "무시", "지시", "명령", "시스템", "프롬프트", "어시스턴트",
]

# ---- 치환 가능한 필드. values가 있으면 그 값만, 없으면 짧은 단어(max_len, 영문·한글·숫자·공백)만.
[field.season]
values = ["spring", "summer", "autumn", "winter"]

[field.color_theme]
values = ["warm cream", "soft pastel", "deep blue", "forest green", "sunset orange"]

[field.category]
max_len = 30   # 책 분류 같은 짧은 단어 (예: "그림책", "essay")

# ---- 템플릿
[template.cat_bookstore_image]
kind = "image"
resolution = "1024x1024"
quality = "medium"
fields = ["season", "color_theme", "category"]
sentence = "A flat illustrated scene of a friendly cartoon cat mascot browsing shelves in a cozy independent bookstore, {season} atmosphere, {color_theme} color palette, a small display themed around {category}. Original character design. No text, no letters, no numbers, no logos, no real people, no real brands, no readable book covers."

# 장애 사과 글용 이미지. 사과 문구는 이미지에 그리지 않고 캡션으로만 전한다(글자 금지).
# 사람·아동·실존 인물 없음, 원본 고양이 마스코트만, 차분한 파스텔 톤. 장애 초안 경로가 필드를 코드로 고정한다.
[template.cat_apology_image]
kind = "image"
resolution = "1024x1024"
quality = "medium"
fields = ["color_theme"]
sentence = "A calm flat illustrated scene of a friendly cartoon cat mascot standing quietly in a softly lit, tidy, empty room with its head gently bowed in a respectful, apologetic pose, serene and sincere mood, {color_theme} color palette. Original character design, the cat mascot is the only character in the scene. No text, no letters, no numbers, no logos, no people, no children, no real people, no real brands, no readable signs or book covers."

[template.cat_bookstore_video]
kind = "video"
resolution = "720p"
duration_s = 15
fields = ["season", "color_theme", "category"]
sentence = "A short vertical animated clip of a friendly cartoon cat mascot walking through a cozy independent bookstore and pulling a book from a shelf, {season} atmosphere, {color_theme} color palette, a small display themed around {category}.{plan_clause} Gentle camera movement, original character design. No text, no letters, no numbers, no logos, no real people, no real brands, no readable book covers."

# ---- 오디오(BGM) 템플릿. 연주곡만: 목소리·가사·효과음 없음. 실제 곡·아티스트·브랜드 이름은 넣지 않는다.
# 어댑터(gemini_audio)도 연주곡 제한 문구가 빠져 있으면 항상 덧붙인다.
[field.bgm_mood]
values = ["calm", "cozy", "cheerful", "dreamy", "warm", "playful"]

[field.bgm_genre]
values = ["lo-fi", "acoustic guitar", "soft piano", "light jazz", "ambient", "ukulele"]

[template.cat_bookstore_bgm]
kind = "audio"
resolution = "30s"
fields = ["bgm_mood", "bgm_genre"]
sentence = "A {bgm_mood} {bgm_genre} background track for a short vertical video about a cozy independent bookstore, steady gentle tempo, loop-friendly. Instrumental only, no vocals, no lyrics, no spoken words, no sound effects. Original composition."

# ---- 기획 영상 제작안(video_plan)으로 만드는 영상 (11/22). 고정 틀만 있고 주인공·배경·장면은 기획의
# plan_* 필드로만 들어간다(정리·금칙 검사 뒤). 장면이 하나도 안 남으면 video_draft가 예전 영상 템플릿으로 돌아간다.
# plan_* 필드 없이는 내용이 없어 다른 경로(브리프·화면)의 영상 템플릿 후보가 아니다
[template.plan_story_video]
kind = "video"
resolution = "720p"
duration_s = 15
fields = []
sentence = "A short vertical animated clip.{plan_clause} Gentle camera movement, original character design. No text, no letters, no numbers, no logos, no watermarks, no subtitles, no real people, no celebrities, no real brands, no readable book covers."
