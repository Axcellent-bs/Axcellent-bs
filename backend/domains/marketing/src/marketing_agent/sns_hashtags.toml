# SNS 주제 해시태그 화이트리스트. 기획안(brief)의 이미 있는 필드에서 고르는 결정적 규칙이다(LLM 없음).
# 여기에 적은 태그만 붙는다. 임의 문자열을 태그로 만들지 않는다. 다른 파일을 쓰려면
# 환경변수 MARKETING_SNS_HASHTAG_CONFIG에 경로를 준다.
#
# 검증(읽을 때): 태그는 `#` + 한글·영문·숫자·밑줄만(공백·특수문자 없음), 금칙어(참여 조건 문구,
# 성과 과장 표현)를 포함하면 안 된다. 어긋나면 설정 오류라 주제 태그 없이 브랜드 태그만 쓴다.
# 장애 사과·정상화 안내 초안(outage)은 이 설정을 쓰지 않는다(브랜드 태그만).
# 태그 이름·매핑은 초안이다. [확인 필요: 마케팅 담당 확정]

# 늘 붙는 브랜드 태그
brand = ["#캣북스"]
# 주제 태그 상한(브랜드 태그 제외). 총 개수는 별도로 sns.HASHTAG_MAX(30)를 넘지 못한다
max_topic_tags = 4

# 1) 키워드: 기획안 title·idea·products·trend_refs에 아래 단어가 글자 그대로 들어 있으면 그 태그.
#    (why·facts는 읽지 않는다.) 위에서 아래 순서로 고른다
[[keyword]]
words = ["그림책"]
tags = ["#그림책", "#책"]

[[keyword]]
words = ["도서", "서점"]
tags = ["#도서", "#책"]

[[keyword]]
words = ["책 추천", "책추천"]
tags = ["#책추천", "#책"]

[[keyword]]
words = ["독서"]
tags = ["#독서"]

[[keyword]]
words = ["신간"]
tags = ["#신간"]

[[keyword]]
words = ["고양이"]
tags = ["#고양이"]

# 2) content_category(기획이 숏츠 형식 이름으로 채운다). 목록에 없는 값은 건너뛴다
[category]
"챌린지" = ["#챌린지"]
"상황극·스케치" = ["#상황극"]
"리액션" = ["#리액션"]
"정보·팁" = ["#꿀팁"]
"비포애프터" = ["#비포애프터"]
"브이로그" = ["#브이로그"]
"밈 패러디" = ["#밈"]

# 3) content_format (shorts | reels)
[format]
shorts = ["#쇼츠"]
reels = ["#릴스"]
