# Instagram 게시 안전 한도. 코드 상수로 박지 않고 이 파일에서만 바꾼다.
# 다른 파일은 MARKETING_SNS_LIMITS_CONFIG 환경변수로 지정한다.
[publish]
# 이동 24시간 창에서 우리 쪽이 허용하는 게시 수(캐러셀은 1건).
# Meta 계정 한도(content_publishing_limit의 quota_total, 현재 50)보다 낮게 둔 안전 여유다.
# 실제 어댑터가 읽어 온 quota_total이 이보다 작으면 그 값을 쓴다.
max_posts_per_24h = 45

# 중단(publish_halted) 해제: 한도 초과(2207042)·계정 제한(2207050)·스팸 판정(2207051) 오류가
# 나면 새 게시를 모두 막는다. 사람이 Instagram 앱·비즈니스 도구에서 상태를 확인한 뒤,
# 이 값을 "지금 시각"(ISO 8601, 시각대 포함, 예: 2026-11-13T09:00:00+09:00)으로 바꾸면
# 그 시각 이전의 중단 기록은 풀린다. 비워 두면 풀리지 않는다.
halt_cleared_before = ""
