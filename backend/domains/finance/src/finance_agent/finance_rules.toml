# 재무·세무 판단 규칙과 근거. 코드는 이 파일을 읽어 계산하고, 결과에 적용 규칙을 함께 낸다.
#
# - 계산식은 코드(시험으로 지킴), 값·기준·근거는 여기에 둔다. 바꾸면 version을 올린다
# - review: "expert"는 전문가가 확인한 규칙, "pending"은 전문가 확인 전이다
# - 세법 조항과 회계 기준은 공개 자료로 찾아 적었다. 신고와 판단의 최종 책임은 세무사·담당자에게 있다

version = 15
updated = "2026-11-17"

# 세무사·회계사에게 먼저 물을 질문. 묶음의 expert-review-checklist.docx에 들어간다
expert_questions = [
  "회사는 K-IFRS와 일반기업회계기준 중 무엇을 쓰나요? 지금 근거는 K-IFRS로 적었습니다.",
  "판매 수수료를 결제 시점에 잡아도 되나요? 지금은 결제 시각 기준 단순화입니다 (REV-002).",
  "약관상 회사 부담 쿠폰이 수수료에서 직접 공제되나요? 에누리 여부가 달라집니다 (VAT-003).",
  "판매 수수료와 PG 수수료는 부가세 별도인가요, 포함인가요? (finance_policy.toml [tax])",
  "판매자별 명세(제75조) 서식과 사업자등록번호 수집은 어떻게 하나요? (VAT-005)",
  "확정 뒤 숫자가 달라졌을 때 당기 조정으로 처리하는 기준과 금액 기준이 맞나요? (CLS-004)",
  "회사가 법인세법상 소규모 법인(200억 이하 20%)에 해당하지 않나요? 법인지방소득세 조문도 확인이 필요합니다 (CIT-001).",
]

[campaign]
good_roi = 0.2            # ROI가 이 값 이상이면 좋음
bad_roi = 0.0             # ROI가 이 값 미만이면 나쁨 (적자)

[brake]
budget_ratio_of_last_month = 0.3  # 월 예산 = 직전 달 영업 결과 × 이 비율. 번 돈 안에서만 쓰고 나머지는 급여 등 장부에 없는 비용 몫
monthly_budget_krw = 1000000   # 직전 달 자료가 없을 때만 쓰는 임시값
min_viable_krw = 50000         # 이보다 적게 남으면 조건부 승인도 의미가 없어 거절한다
loss_limit_krw = 500000        # 이달 캠페인 손실 합계가 이 값 이상이면 거절
loss_streak_reject = 2         # 같은 채널이 연속으로 이만큼 적자면 거절
cash_lookahead_weeks = 4       # 앞으로 이 주수의 현금 여유(예상 잔액 최저값, 잔액을 모르면 누적 순현금)를 본다

# 고객 반응(고객지원 `book_issue_stats`)이 나쁜 책이 든 캠페인의 예산 의견을 줄인다 (CRX-001)
[customer_reaction]
min_sold_qty = 5          # 판매가 이보다 적은 책은 비율이 흔들려 의견을 바꾸지 않고 참고만 한다 (데이터와 같은 값)
claim_rate = 0.10         # 판매 대비 클레임 비율이 이 값 이상이고
min_claims = 2            # 클레임이 이만큼 이상이면 걸린다 (5권 중 1건이 20%로 바로 걸리는 것을 막는다)
defect_claims = 3         # 또는 불량 계열(불량·파손·오배송·누락) 클레임이 이만큼 이상이면 걸린다 (비율과 따로)
limit_factor = 0.5        # 걸리면 요청당 한 번만 한도에 곱한다 (책이 여럿 걸려도 한 번)
call_seconds = 3.0        # 고객지원을 부르는 제한 시간. 넘기거나 오류면 "못 읽음"으로 보고 한도는 그대로 둔다

[closing]
spike_ratio = 3.0             # 하루 판매액이 평소의 이 배 이상이면 확정 전에 알린다
spike_trailing_days = 28      # 평소를 재는 기간
spike_min_sales_days = 14     # 판매가 있던 날이 이보다 적으면 평소를 모르므로 비교하지 않는다
budget_min_sales_days = 20    # 직전 달 판매일이 이보다 적으면 그 달로 낸 예산은 임시값으로 표시한다

[repeat]
window_days = 90          # 첫 구매 뒤 이 기간의 재구매를 본다
min_cohort_buyers = 30    # 첫 구매가 기간보다 오래된 구매자가 이만큼 없으면 추정하지 않는다

[lessons]
limit_factor = 0.5        # 실패 1건마다 그 채널 승인 한도에 곱한다
floor_factor = 0.25       # 아무리 줄어도 이 비율 아래로는 안 내린다

[insights]
trend_min_campaigns = 3   # 채널 하락 추세를 보는 최소 캠페인 수
overrun_window_days = 90  # 반복 초과를 보는 기간
overrun_min_count = 2     # 이만큼 반복되면 인사이트
tax_deadline_warn_days = 14
# 콘텐츠 카테고리별 제작비 재배분(INS-005). 7일 조회수가 잰 카테고리끼리만 비교한다
shift_min_categories = 2   # 이만큼 카테고리가 있어야 비교한다
shift_min_ratio = 2.0      # 가장 비싼 카테고리의 조회당 제작비가 가장 싼 쪽의 이 배수 이상일 때만
shift_pct = 0.3            # 다음 회차에 가장 싼 쪽 제작비를 이만큼 올리고, 그만큼 가장 비싼 쪽에서 뺀다

[[income_tax.brackets]]   # 법인세법 제55조 ①, 2026-01-01 이후 개시 사업연도
upto_krw = 200000000
rate = 0.10
[[income_tax.brackets]]
upto_krw = 20000000000
rate = 0.20
[[income_tax.brackets]]
upto_krw = 300000000000
rate = 0.22
[[income_tax.brackets]]
rate = 0.25               # 3,000억 원 초과
[income_tax]
local_rate_of_tax = 0.10  # 법인지방소득세는 법인세 세율의 10분의 1 수준

# ---------------------------------------------------------------- 매출·비용·손익
[[rules]]
id = "REV-001"
area = "revenue"
title = "회사 매출은 판매 수수료만"
statement = "우리 회사는 판매자와 고객을 이어 주는 중개 회사다. 그래서 고객이 낸 돈 전체(총거래액)가 아니라, 판매자에게 받는 수수료만 회사 매출로 본다."
basis = "국제회계기준(K-IFRS)에서 중개 회사의 매출을 보는 방법"
review = "pending"

[[rules]]
id = "REV-002"
area = "revenue"
title = "결제된 날의 매출로 잡음"
statement = "고객 결제가 성공한 날에 그 주문의 수수료를 매출로 잡는다. 배송이 끝난 날로 잡는 방법과 날짜가 조금 다를 수 있어 회계사 확인이 필요하다."
basis = "국제회계기준(K-IFRS)의 매출 인식 시점. 날짜를 단순하게 정한 것이라 회계사 확인 필요"
review = "pending"

[[rules]]
id = "REV-003"
area = "revenue"
title = "회사가 낸 쿠폰은 매출에서 뺌"
statement = "회사가 대신 부담한 쿠폰 할인은 비용이 아니라 고객에게 돌려준 돈으로 보고, 매출에서 뺀다."
basis = "국제회계기준(K-IFRS)에서 고객에게 돌려준 돈을 다루는 방법"
review = "pending"

[[rules]]
id = "EXP-001"
area = "expense"
title = "결제 수수료는 회사 운영비"
statement = "결제대행사(PG)에 내는 수수료는 회사를 운영하는 데 드는 비용(판매비와관리비)으로 적는다."
basis = "국제회계기준(K-IFRS)의 비용 분류"
review = "pending"

[[rules]]
id = "EXP-002"
area = "expense"
title = "광고비는 회사 운영비"
statement = "캠페인 광고비는 광고선전비로, 회사를 운영하는 데 드는 비용(판매비와관리비)에 넣는다."
basis = "국제회계기준(K-IFRS)의 비용 분류"
review = "pending"

[[rules]]
id = "PL-001"
area = "profit"
title = "영업 결과 계산"
statement = "영업 결과 = 판매 수수료 − 회사가 낸 쿠폰 − 결제 수수료. 월급·임차료는 쇼핑몰 장부에 없어서 여기에는 빠져 있다."
basis = "재무 AI 내부 관리 기준"
review = "pending"

[[rules]]
id = "PL-003"
area = "profit"
title = "장부에 없는 돈은 사람이 입력"
statement = "월급, 임차료, 그 밖의 운영비, 영업 밖 수익·비용, 법인세는 쇼핑몰 장부에 없어서 재무 담당자가 달마다 합계를 입력한다. 입력한 달만 재무제표 아래 칸을 계산하고, 법인세를 비우면 순이익도 비운다. 확정한 달은 고칠 수 없다."
basis = "재무 AI 내부 기준. 입력한 금액은 입력한 사람이 회계 자료로 확인해야 한다"
review = "pending"

[[rules]]
id = "PL-002"
area = "profit"
title = "자료가 없으면 비워 둠"
statement = "월급, 영업 밖 수익·비용, 법인세처럼 장부에 없는 항목은 입력하지 않으면 0원으로 채우지 않고 비워 둔다."
basis = "재무 AI 내부 기준 (없는 숫자를 지어내지 않는다)"
review = "expert"

[[rules]]
id = "BNK-001"
area = "closing"
title = "판매자 정산은 통장 출금으로 확인"
statement = "정산 지급 승인은 '보내라'는 지시일 뿐이다. 승인한 뒤 며칠 안에 같은 금액이 통장에서 실제로 나가야 지급된 것으로 본다. 출금을 못 찾으면 아직 안 보냈을 수 있다고 본다."
basis = "회사 돈 관리 원칙: 승인한 지급과 실제 통장 출금을 맞춰 본다"
review = "pending"

[[rules]]
id = "BNK-002"
area = "closing"
title = "이유 모를 출금은 사람이 메모로 닫음"
statement = "판매자 정산이나 정해 둔 항목(월급·임차료·광고비·세금)에 해당하지 않는 출금은 장부에 근거가 없는 돈이다. 사람이 이유를 적어야 월 마감이 끝난다. 장부 숫자는 바꾸지 않는다."
basis = "회사 돈 관리 원칙: 이유를 모르는 거래는 확인해서 남긴다"
review = "pending"

[[rules]]
id = "CSH-001"
area = "closing"
title = "현금 예측은 마지막 통장 잔액에서 시작"
statement = "마지막으로 올린 통장 잔액에 앞으로 들어올 돈(결제대행사 정산금)과 나갈 돈(판매자 정산금, 입력한 월 고정비)을 더하고 빼서 주별 예상 잔액을 낸다. 잔액을 올린 지 오래됐으면 그 뒤 거래는 빠져 있다."
basis = "13주 현금 흐름 예측 방식. 은행과 바로 연결되지 않아 사람이 올린 거래내역을 쓴다"
review = "pending"

[[rules]]
id = "CLS-001"
area = "closing"
title = "확정한 숫자는 그대로 둠"
statement = "결산을 확정하면 그때 숫자를 저장해 보고에 그대로 쓴다. 나중에 숫자가 달라져도 고쳐 쓰지 않고 차이를 따로 보여 주고, 차이는 생긴 달에 조정으로 처리한다."
basis = "회사 돈 관리 원칙. 큰 오류를 지난 숫자까지 고칠지는 회계사가 판단"
review = "pending"

[[rules]]
id = "CLS-002"
area = "closing"
title = "결제 정산이 끝나야 월 결산 확정"
statement = "결제대행사 정산이 아직 안 된 결제가 남아 있으면 월 결산을 확정하지 않는다. 하루 결산은 빠른 보고라 확정할 수 있지만, 정산 안 된 건수를 경고하고 함께 저장한다."
basis = "회사 돈 관리 원칙 (결제대행사 정산 주기는 재무 설정에 있음)"
review = "pending"

[[rules]]
id = "CLS-003"
area = "closing"
title = "평소와 크게 다른 날은 알림"
statement = "하루 판매액이 평소보다 크게 많으면 확정하기 전에 알린다. 판매한 날이 적어 평소 수준을 모르면 비교하지 않는다."
basis = "회사 돈 관리 원칙 (몇 배부터 알릴지는 재무 설정에 있음)"
review = "pending"

[[rules]]
id = "CLS-004"
area = "closing"
title = "확정 뒤 차이는 그 달 조정으로"
statement = "확정한 달의 숫자가 달라지면 재무 AI가 조정 분개 안(장부를 맞추는 기록 안)을 만들고, 사람이 이유를 적어 반영한다. 조정은 반영한 달의 결산에 따로 보이고, 확정한 달의 숫자는 고치지 않는다. 하루 결산은 빠른 보고라 조정하지 않는다."
basis = "회사 돈 관리 원칙. 큰 오류를 지난 숫자까지 고칠지는 회계사가 판단"
review = "pending"

[[rules]]
id = "CLS-005"
area = "closing"
title = "월 마감 할 일의 기한"
statement = "월 마감 체크리스트의 항목마다 기한이 있고, 끝나지 않은 채 기한이 지나면 '기한 지남'으로 보인다. 하루 결산 확정은 다음 날, 매출·결제 맞춰 보기와 은행 입출금 맞춰 보기는 다음 달 3일, 판매자 정산 지급 승인은 그 주 지급 예정일, 판매자 미지급금 정리와 월 결산 확정은 다음 달 5일까지다. 기한은 알림일 뿐 확정을 막지 않는다."
basis = "회사 돈 관리 원칙 (기한 날짜는 재무 설정에 있음). 판매자 지급일은 고객지원의 정산 정책을 따른다"
review = "pending"

[[rules]]
id = "VAT-006"
area = "vat"
title = "부가세 신고 숫자는 그대로 둠"
statement = "끝난 분기의 부가세 숫자와 판매자 명세를 사람이 확정하면 그때 숫자를 저장해 세무사에게 넘길 파일에 쓴다. 나중에 장부가 달라져도 고치지 않고 차이를 보여 주며, 신고를 고칠지는 세무사가 판단한다."
basis = "국세기본법의 수정신고·경정청구(신고를 고치는 절차). 판단은 세무사 업무"
review = "pending"

# ---------------------------------------------------------------- 예산
# 판매자 정산금 계산(SET-001)은 고객지원 규칙(support_agent/settlement_policy.toml)으로 옮겼다(2026-11-12).
# 재무는 고객지원이 계산한 정산 결과를 받아 쓰기만 한다.
[[rules]]
id = "BUD-001"
area = "budget"
title = "팀 예산 계산"
statement = "팀 예산 = 그달 1일의 팀 인원 × 한 사람당 월 금액. 확정은 인사 AI가 하고 재무는 기록한다."
basis = "인사·재무 합의 (2026-11-02)"
review = "expert"

# ---------------------------------------------------------------- 부가세
[[rules]]
id = "VAT-001"
area = "vat"
title = "부가세를 내는 매출은 수수료"
statement = "책 같은 상품 매출은 판매자가 직접 신고한다. 회사가 부가세를 내는 매출은 중개 수수료다. 부가세가 없는 책을 중개해도 수수료에는 부가세가 붙는다."
basis = "부가가치세법 (도서 면세), 세무 관점 검토 (2026-10-30)"
review = "pending"

[[rules]]
id = "VAT-002"
area = "vat"
title = "결제 수수료의 부가세는 돌려받음"
statement = "세금계산서를 받은 결제 수수료에 붙은 부가세는, 회사가 낼 부가세에서 빼 준다(매입세액 공제)."
basis = "부가가치세법 (공제받는 부가세)"
review = "pending"

[[rules]]
id = "VAT-003"
area = "vat"
title = "회사가 낸 쿠폰과 부가세"
statement = "약관상 쿠폰 금액을 수수료에서 바로 깎아 주면 부가세를 매길 금액에서 뺀다. 판매자에게 현금으로 채워 주는 방식이면 못 뺄 수도 있어서 두 경우의 숫자를 모두 보여 준다."
basis = "대법원 판결 (2016. 6. 23.)"
review = "pending"

[[rules]]
id = "VAT-004"
area = "vat"
title = "부가세 신고 기한"
statement = "법인은 4월 25일·10월 25일(예정 신고), 7월 25일·1월 25일(확정 신고)까지 신고한다."
basis = "부가가치세법 (신고 기한)"
review = "pending"

[[rules]]
id = "VAT-005"
area = "vat"
title = "판매자별 판매 명세 제출"
statement = "분기가 끝난 다음 달 15일까지 낸다. 서식은 국세청 고시를 확인하기 전 초안이고, 사업자등록번호는 자료가 없어 비워 둔다."
basis = "부가가치세법 (판매·중개 명세 제출)"
review = "pending"

# ---------------------------------------------------------------- 법인세
[[rules]]
id = "CIT-001"
area = "income_tax"
title = "법인세 참고 추정"
statement = "장부의 영업 결과에 법인세율을 곱해 본 참고 숫자다. 세무조정과 월급·임차료가 빠져 있어 신고에는 쓰지 않는다."
basis = "법인세법 세율, 국세청 안내 (2026-11-04 확인). 세무조정은 세무사 업무"
review = "pending"

# ---------------------------------------------------------------- 세무 전달
[[rules]]
id = "TAX-001"
area = "handoff"
title = "AI는 파일까지, 전달과 신고는 사람"
statement = "재무 AI는 숫자를 모으고 파일을 만든다. 사람이 내려받아 세무사에게 보내고, 검토와 신고는 세무사와 담당자가 한다."
basis = "재무 AI 내부 기준 (AI가 할 수 있는 일의 범위)"
review = "expert"

# ---------------------------------------------------------------- 캠페인 손익
[[rules]]
id = "CMP-001"
area = "campaign"
title = "캠페인 매출은 수수료 기준"
statement = "캠페인 매출 = 캠페인으로 늘어난 판매액 × 판매 수수료율. 회사가 버는 돈은 판매액 전체가 아니라 판매자에게 받는 수수료라서, 판매액 전체를 매출로 보면 적자가 흑자로 보인다."
basis = "회사 매출은 판매 수수료만이라는 기준과 같다(국제회계기준)"
review = "pending"

[[rules]]
id = "CMP-002"
area = "campaign"
title = "캠페인 비용"
statement = "캠페인 비용 = 광고비 + 회사가 부담한 쿠폰 + 늘어난 판매액에 붙는 결제대행(PG) 수수료. 영상 제작비가 있으면 함께 더한다."
basis = "광고비·쿠폰·결제 수수료를 비용으로 보는 회사 기준과 같다"
review = "pending"

[[rules]]
id = "CMP-003"
area = "campaign"
title = "손익과 ROI"
statement = "손익 = 캠페인 매출 − 캠페인 비용. ROI(투자 대비 수익률) = 손익 ÷ 쓴 돈(광고비·제작비·쿠폰). 예: 100만 원을 써서 20만 원이 남으면 ROI 20%. 재구매는 넣지 않은 단기 손익이다."
basis = "재무 AI 내부 관리 기준"
review = "pending"

[[rules]]
id = "CMP-006"
area = "campaign"
title = "시작한 캠페인만 기록"
statement = "안전 장치가 실행을 허락한 캠페인만 손익을 적는다. 광고비는 광고 플랫폼 보고서의 실제 집행액이고, 시작할 때 정한 금액을 넘으면 기록하되 넘은 금액을 함께 표시한다."
basis = "안전 장치의 캠페인 집행 규칙"
review = "pending"

[[rules]]
id = "CMP-005"
area = "campaign"
title = "재구매 포함 손익 (참고)"
statement = "한 번 산 고객이 평균 몇 번 더 사는지(재구매 배수)를 판매액에 곱해 본 참고 손익이다. 전체 고객 평균이라 캠페인 고객과 다를 수 있어서, 좋고 나쁨 판단과 예산 의견에는 쓰지 않는다."
basis = "재무 AI 내부 관리 기준 (최근 구매 고객이 충분히 쌓였을 때만 계산)"
review = "pending"

[[rules]]
id = "CMP-004"
area = "campaign"
title = "효율 판단"
statement = "ROI가 '좋음' 기준 이상이면 좋음, 0% 미만(적자)이면 나쁨, 그 사이는 보통으로 본다."
basis = "재무 AI 내부 관리 기준 (좋음 기준은 재무 설정에 있음)"
review = "pending"

# ---------------------------------------------------------------- 재무 브레이크
[[rules]]
id = "BRK-001"
area = "brake"
title = "남은 예산"
statement = "이달 캠페인 예산은 지난달 영업 결과의 일정 비율이다. 지난달이 적자면 이달 예산은 0원이다. 이미 쓴 돈과 진행 중인 돈을 빼고, 요청이 남은 예산보다 크면 남은 만큼만 권한다. 남은 돈이 너무 적으면 권하지 않는다."
basis = "재무 AI 내부 기준 (비율과 최소 금액은 재무 설정에 있음)"
review = "pending"

[[rules]]
id = "BRK-002"
area = "brake"
title = "연속 적자"
statement = "같은 채널에서 캠페인이 정해진 횟수만큼 연속으로 적자면 그 채널에는 권하지 않는다."
basis = "재무 AI 내부 기준 (횟수는 재무 설정에 있음)"
review = "pending"

[[rules]]
id = "BRK-003"
area = "brake"
title = "이달 손실 누적"
statement = "이번 달 캠페인 손실을 모두 더한 금액이 한도 이상이면 더 권하지 않는다."
basis = "재무 AI 내부 기준 (한도 금액은 재무 설정에 있음)"
review = "pending"

[[rules]]
id = "BRK-004"
area = "brake"
title = "현금 흐름"
statement = "앞으로 몇 주 동안 통장에 남을 돈의 여유가 요청 금액보다 적으면 그 여유만큼만 권하고, 여유가 없으면 권하지 않는다. 통장 잔액을 알면 '예상 잔액이 가장 낮은 때 − 꼭 남겨 둘 현금'으로 보고, 모르면 들어올 돈과 나갈 돈의 차이로 본다. 확인할 수 없으면 최소 금액만 권한다."
basis = "재무 AI 내부 기준, ⑦ 자금·현금 흐름의 13주 예측"
review = "pending"

[[rules]]
id = "BRK-005"
area = "brake"
title = "재무는 의견만 냄"
statement = "재무는 돈을 쓰라고 허락하거나 막지 않고 의견만 낸다. 실제 집행은 안전 장치의 금액 규칙(한 건 금액·하루 합계)과 사람이 정한다. 쿠폰과 환불은 이 규칙에서 보지 않는다."
basis = "안전 장치의 캠페인 집행 규칙, 재무는 건별 승인을 하지 않는다는 원칙"
review = "expert"

[[rules]]
id = "CRX-001"
area = "brake"
title = "고객 반응이 나쁜 책이면 예산 의견을 줄임"
statement = "캠페인이 다루는 책 가운데 최근 30일 판매 대비 클레임 비율이 높거나 불량 클레임이 많은 책이 있으면, 권하는 금액을 한 번 줄인다. 판매가 적은 책은 참고만 하고, 클레임 자료를 못 읽으면 금액을 그대로 두고 못 읽었다고 남긴다."
basis = "멘토링(11/13)의 부서 간 협업: 불만 많은 책에 광고비를 올리지 않도록 고객지원 AI의 책별 클레임 집계를 본다"
review = "pending"

# ---------------------------------------------------------------- 실수 기반 개선
[[rules]]
id = "LRN-001"
area = "lesson"
title = "실패 이력으로 한도 축소"
statement = "그 채널에 적자 캠페인의 교훈이 남아 있으면, 실패했던 집행액보다 줄인 금액까지만 권한다. 너무 많이 줄이지는 않도록 바닥 금액이 있다."
basis = "재무 AI 내부 기준 (줄이는 비율과 바닥은 재무 설정에 있음)"
review = "pending"

[[rules]]
id = "LRN-002"
area = "lesson"
title = "좋은 결과로 교훈 해제"
statement = "그 채널에서 효율 '좋음'이 나오면 남아 있던 교훈을 닫아 권하는 금액을 되돌린다."
basis = "재무 AI 내부 기준"
review = "pending"

# ---------------------------------------------------------------- 인사이트
[[rules]]
id = "CMP-007"
area = "campaign"
title = "제작비와 조회당 제작비"
statement = "영상 제작비는 광고비와 따로 적고 캠페인 비용에 더한다. 조회당 제작비 = 제작비 ÷ 게시 7일 뒤 조회수. 조회수는 데이터 AI가 잰 값만 쓰고, 7일이 안 됐으면 계산하지 않는다(측정 중)."
basis = "광고비와 같은 비용으로 본다. 조회수는 데이터 AI가 영상 성과를 잰 값"
review = "pending"

[[rules]]
id = "INS-005"
area = "insight"
title = "콘텐츠 카테고리 제작비 재배분"
statement = "게시 7일 조회수를 잰 카테고리끼리 조회당 제작비를 비교한다. 가장 비싼 카테고리가 가장 싼 카테고리보다 정해 둔 배수 이상 비싸면, 다음 회차 제작비 일부를 싼 쪽으로 옮기자고 제안한다. 총 제작비는 늘리지 않고, 결정은 기획·마케팅과 사람이 한다."
basis = "조회당 제작비 계산 기준, 재무 AI 내부 기준 (배수와 옮기는 비율은 재무 설정에 있음)"
review = "pending"

[[rules]]
id = "INS-001"
area = "insight"
title = "채널 효율 하락 추세"
statement = "한 채널의 ROI(투자 대비 수익률)가 최근 캠페인마다 계속 내려가면 알린다. 하나씩 보면 놓치기 쉬운 흐름이다."
basis = "재무 AI 내부 기준 (몇 번 연속인지는 재무 설정에 있음)"
review = "pending"

[[rules]]
id = "INS-002"
area = "insight"
title = "손익분기 ROAS 미달"
statement = "채널의 실제 ROAS(광고비 1원당 판매액)가 손익분기 ROAS보다 낮으면 알린다. 손익분기 ROAS는 손해를 보지 않으려면 광고비의 몇 배를 팔아야 하는지다. 회사 몫은 판매액의 수수료에서 PG 수수료를 뺀 만큼이라 이 배수가 높다."
basis = "캠페인 매출·비용 계산 기준"
review = "pending"

[[rules]]
id = "INS-003"
area = "insight"
title = "반복되는 예산 초과"
statement = "재무가 권한 금액보다 많이 쓰거나 남은 예산보다 큰 요청이 일정 기간 안에 반복되면 알린다."
basis = "재무 AI 내부 기준 (기간과 횟수는 재무 설정에 있음)"
review = "pending"

[[rules]]
id = "INS-004"
area = "insight"
title = "세금 일정·확인 알림"
statement = "부가세 신고 기한이 가깝거나, 세무 설정에 확인이 필요한 항목이 남아 있으면 알린다."
basis = "부가세 신고 기한과 쿠폰 부가세 기준"
review = "pending"
