# 재무 설정 (재무 재설계 2026-10-23, docs/notes/finance/2026-10-23-finance-redesign.md 5장).
#
# 판매 수수료율, PG 수수료율, 팀 예산 단가다.
# 금액은 정수 원, 비율은 0~1 소수. 바꾸면 PR로 (재무 담당 확인).

[commission]
default_rate = 0.10                 # 기본 판매 수수료 10%
[commission.category_rates]
book = 0.10                         # 도서 10%
stationery = 0.08                   # 문구 8%

# 판매자 정산 주기·지급일·지급 기한은 고객지원이 정한다(support_agent/settlement_policy.toml, 2026-11-12).

[pg]
fee_rate = 0.031                    # PG 수수료율 기본 3.1%
payout_days = 2                     # 판매일 + 2일에 PG 정산금 지급 (D+2)
fee_tolerance = 1                   # 수수료 반올림 허용 오차(원). 넘으면 fee_anomaly

[tax]
# 세무 지원 자료(tax.py). 아래 값은 2026-10-30 세무 관점 검토 기준이며, 표시한 항목은 세무사 확인 전이다
commission_vat = "excluded"         # 판매 수수료가 부가세 별도(excluded)인지 포함(included)인지 — 약관 확인 필요
pg_fee_vat = "excluded"             # PG 수수료 세금계산서가 부가세 별도인지 — 확인 필요
shipping_supplier = "seller"        # 배송비 공급자: seller(판매자 매출, 도서면 면세 부수 용역) / platform(회사 과세 매출)
coupon_reduces_commission_base = false  # 약관상 쿠폰을 수수료에서 공제하면 true (대법원 2014두298) — 확인 필요
default_tax = "taxable"             # 분류에 없는 상품은 과세로 본다
[tax.category_tax]
book = "exempt"                     # 도서 면세 (부가세법 제26조①8). 판매자 매출 참고용
stationery = "taxable"

[bank]
pg_memo = ""                        # 은행 거래내역 적요에 이 글자가 있는 입금만 PG 정산금으로 본다 (비우면 모든 입금)
transfer_days = 3                   # 정산 묶음 승인일부터 이 날 수 안에 같은 금액 출금이 있으면 판매자 이체 확인

# 판매자 이체가 아닌 출금을 적요 글자로 나눈다. 회사 통장 적요에 맞게 바꾼다. 어디에도 안 걸리면 "설명 없음"
[bank.out_categories]
"급여" = ["급여", "상여"]
"임차료" = ["임대료", "임차료", "월세", "관리비"]
"광고비" = ["광고", "네이버", "카카오", "메타", "구글"]
"세금" = ["국세", "지방세", "부가세", "법인세", "원천세"]

[cashflow]
trailing_weeks = 8                  # 확정된 돈이 없는 뒤쪽 주는 최근 이 주수 평균으로 추정
min_cash_krw = 0                    # 예상 잔액이 이 값보다 적은 주를 "현금 부족 예상"으로 표시
stale_days = 7                      # 기초 잔액(마지막 통장 잔액)이 이 날 수보다 오래되면 "오래됨"으로 표시

[variance]
flag_ratio = 0.1                    # 지난달보다 10% 이상 움직이고
flag_min_amount = 10000             # 변동액이 1만 원 이상이면 "크게 움직인 줄"

[team_budget]
# 팀 예산 = 그달 1일 팀 인원(인사 AI team_headcount) × 인당 월 단가. 파견은 세지 않는다(원래 팀)
# 회사마다 다르면 회사 폴더 tenant.toml [finance] per_head_monthly 로 덮는다
per_head_monthly = 100000

[closing]
# 월 마감 체크리스트(close_checklist.py)의 항목별 기한. 화면에 "기한 12-03(수)"로, 지나면 "기한 지남"으로 보인다.
# 규칙은 CLS-005(finance_rules.toml). 일은 늦어도 이 날까지 끝낸다(그날 포함)
daily_closing_due_days = 1          # 일 결산 확정: 그날 + 1일(다음 날). 남은 날이 있으면 가장 이른 남은 날 기준
reconciliation_due_day = 3          # 매출·PG 대사 메모: 다음 달 3일
bank_due_day = 3                    # 은행 입금 대조: 다음 달 3일
settlement_pay_after_days = 6       # 판매자 정산 지급 승인: 그 주 지급 예정일(정산 기간 끝 + 6일). 고객지원 내역서에 지급일이 있으면 그 날
bank_out_due_day = 3                # 은행 출금 대조: 다음 달 3일
payables_due_day = 5                # 판매자 미지급금 롤포워드: 다음 달 5일
month_closing_due_day = 5           # 월 결산 확정: 다음 달 5일
