# 부서 평가 기준값 (임시 v1). 장애 대응에서 부서가 "일한 시간"을 판정할 때 쓴다.
#
# 사람만 바꾼다(PR). 바꾸는 사람은 인사(준하)이고, 해당 부서 담당자를 PR에 태그한 뒤
# 머지되면 #소통에 PR 링크와 바뀐 값을 올린다. 바꾸면 version을 올린다.
# 판정은 이 version을 같이 저장하므로, 기준을 바꿔도 지난 판정이 섞이지 않는다.
#
# 정해진 방식 (2026-11-09 팀 합의):
# - 총괄이 부서를 한 번 부를 때 30초에서 끊고 다시 시도한다. 그래서 30초를 넘었다는 건
#   곧 재시도가 있었다는 뜻이라 "지연" 구간을 따로 두지 않는다.
# - 정상: 일한 시간이 normal_max_seconds 이하이고 시도 횟수가 normal_max_attempts 이하
# - 확인 필요: 그 밖의 모든 경우 (시도 횟수를 같이 보여 준다)
# - 승인 대기·사람 할 일함 대기는 일한 시간에 들어가지 않는다 (총괄이 따로 잰다)
# - 실패·막힘, 기록 없음, 승인 만료는 시간이 아니라 상태로 먼저 가른다 (judge.py)

# v2 (2026-11-12): 단계마다 약속 시간이 다르다. 멘토 피드백: 30초 하나로 모든 일을 재면 쉬운 일을 많이
# 처리한 쪽에 유리하고 오래 걸리는 일에 불리하다. 총괄이 단계 기록에 붙여 보낸 약속 시간
# (`promised_seconds`)을 기준 시간으로 쓰고, 약속이 없는 단계만 아래 normal_max_seconds(30초)를 쓴다.
# 약속은 총괄이 단계 정의(plans/scenario_a.py `PROMISED_SECONDS`)에 임시값으로 두며 운영 기준이 아니다.
# 이미 저장된 판정(v1)은 그대로 두고 판정마다 기준값 버전이 남는다.

version = 2
updated = "2026-11-12"

[default]
normal_max_seconds = 30
normal_max_attempts = 1
use_promised = true

# 부서·묶음별로 다르게 해야 할 때만 아래처럼 덧붙인다. 지금은 모든 단계가 같은 기준이다.
# 묶음 이름은 stages.py의 group 값이다.
# [group."LLM 분석"]
# normal_max_seconds = 30
# normal_max_attempts = 1
