# 누비투어(가상 고객사, 해외 패키지 여행사) 지표 카탈로그. 형식: ax_contracts.schemas.data.MetricCatalog
# 누비투어는 자기 API(/api/v1 예약·투어)를 사이트 변환기로 shop-api 규격으로 바꿔 읽는다.
# 변환기로 실제로 받을 수 있는 지표만 둔다(예약 = 주문). 결제 실패율·실패 주문은 누비투어 API에 없어 넣지 않는다
id = "nubi"
name = "누비투어"
connector = "shop-api"
# 거래량 지표: 빈 구간 판단, 거래량에 따른 기준 보정
volume_metric = "order_count"
volume_label = "예약"

[[metrics]]
id = "order_count"
label = "예약 수"
bad_direction = "down"  # 감소만 이상 (특가·시즌으로 늘어난 것은 이상이 아님)
unit = "건"
aggregate = "sum"

[[metrics]]
id = "inquiry_count"
label = "문의량"
bad_direction = "up"
unit = "건"
aggregate = "sum"

[[metrics]]
id = "cancel_count"
label = "예약 취소"
bad_direction = "up"  # 늘면 이상
unit = "건"
aggregate = "sum"

[[metrics]]
id = "refund_amount"
label = "환불액"
bad_direction = "up"
unit = "원"
aggregate = "sum"

# 영향 분석·설명 문장의 단위
[impact]
unit_label = "예약"
customer_label = "고객"
money_field = "amount"
money_unit = "원"
money_label = "결제 실패(미결제) 금액"

# 매출 분석(sales_analysis) 공통 설정 (11/25). 형식: ax_contracts.schemas.data.CatalogSales
# 사이트 변환기가 예약을 shop-api 판매 기록으로 바꿔 주므로 매출·객단가·재구매율은 업종과 상관없이 같은 식으로 센다.
# 분류·장르·회원 속성처럼 업종 전용 칸은 두지 않는다. 숫자는 코드가 판매 기록에서 계산한다
[sales]
version = "1"
revenue_definition = "매출 = 결제 완료 예약의 금액 − 할인 − 기간 안 환불"
min_product_orders = 5
max_staleness_minutes = 30
min_period_orders = 20
min_group_size = 5
active_days = 365

# 고객 속성 (11/26). 사이트 변환기가 고객사 주문 원본에서 꺼내는 code와 같다
# (dashboard-api `site_adapter/customer_attrs.py`: 성별 → female·male, 생년 → 연령대).
# 사이트가 이 값을 주지 않으면 고객·시장 분석은 "이 회사 사이트에서 받은 고객 속성이 없어요"로 멈춘다
# (다른 회사 값으로 채우지 않는다). 순서 = 화면 순서
[[sales.attributes]]
key = "age_band"
label = "연령대"
[sales.attributes.values]
10s = "10대"
20s = "20대"
30s = "30대"
40s = "40대"
50s_plus = "50대 이상"

[[sales.attributes]]
key = "gender"
label = "성별"
[sales.attributes.values]
female = "여성"
male = "남성"
