# 캣북스 가짜 판매 데이터 설정 (데모 전용). `DATA_SALES_SOURCE=fake`일 때만 `sales_fake`가 읽는다.
# 기본은 꺼짐이고 공용 서버(251)에서는 켜지 않는다. 실제 판매 서버가 고객 내보내기·장르·가상 회원을
# 내놓기 전까지 고객·시장 분석을 끝까지 돌려 보려고 같은 계약 모양으로 만든다.
# 아래 숫자는 모두 가정 값이다 (실제 캣북스 고객·주문 분포가 아니다).
# 같은 seed면 같은 회원·주문이 나온다. 하루치 주문은 (seed, 날짜)로 정해져 실행한 날과 상관없이 같다.

seed = 20261116
members = 3000  # 가상 회원 수 (가정)
period_days = 90  # 오늘까지 며칠치 주문을 만들지
orders_per_day = 60  # 하루 평균 주문 수 (가정, 날마다 ±20%)
members_from = "2024-01-01"  # 가입 시각 범위 (가정). 실행한 날과 상관없이 고정
members_to = "2026-07-31"
coupon_rate = 0.15  # 쿠폰을 쓴 주문 비율 (가정)
coupon_amount = 2000  # 쿠폰 할인 금액 (가정)
points_rate = 0.10  # 포인트를 쓴 주문 비율 (가정)
points_amount = 1000  # 포인트 사용 금액 (가정)
cancel_rate = 0.03  # 취소 주문 비율 (가정)
refund_rate = 0.02  # 부분 환불 주문 비율 (가정)
second_item_rate = 0.25  # 한 주문에 상품이 둘인 비율 (가정)
shipping_fee = 3000  # 배송비 (가정, 2만 원 이상 무료)
free_shipping_over = 20000

# 유입 출처 비율 (가정). direct = 표시 없음(직접 유입)
[sources]
direct = 0.45
naver = 0.25
instagram = 0.12
youtube = 0.10
kakao = 0.08

[source_medium]
naver = "cpc"
instagram = "social"
youtube = "shorts"
kakao = "social"

# 회원 속성 분포 (가정). missing = 그 속성을 비워 둔 회원 비율("모름")
[attributes.age_band]
missing = 0.08  # 가정
values = { "10s" = 0.10, "20s" = 0.28, "30s" = 0.30, "40s" = 0.20, "50s_plus" = 0.12 }  # 가정

[attributes.gender]
missing = 0.05  # 가정
values = { female = 0.55, male = 0.40, no_answer = 0.05 }  # 가정

[attributes.occupation]
missing = 0.15  # 가정
values = { student = 0.18, employee = 0.50, self_employed = 0.10, other = 0.12, no_answer = 0.10 }  # 가정

# 장르 기본 선호 무게 (가정). 아래 묶음 선호가 곱해진다
[genre_weights]
novel = 1.4
essay = 1.0
self_help = 0.9
ai_it = 0.8
business = 0.8
humanities = 0.7
comics = 0.8
kids = 0.6
writing = 0.6
notes = 0.6
deco = 0.5

# 묶음 선호 (가정): 조건(속성 key → 값 code)이 모두 맞는 회원은 장르 무게를 곱한다
[[preferences]]
when = { age_band = "30s", occupation = "employee" }
boost = { ai_it = 3.0, business = 2.5 }  # 가정

[[preferences]]
when = { age_band = "20s", gender = "female" }
boost = { essay = 2.5, novel = 2.0, deco = 1.5 }  # 가정

[[preferences]]
when = { age_band = "10s", occupation = "student" }
boost = { comics = 4.0, writing = 2.0 }  # 가정

[[preferences]]
when = { age_band = "50s_plus" }
boost = { humanities = 2.0, kids = 1.5 }  # 가정 (손주 책)

