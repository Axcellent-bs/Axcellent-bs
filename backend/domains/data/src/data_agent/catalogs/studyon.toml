# 스터디온에듀(가상 고객사, 온라인 강의 플랫폼) 지표 카탈로그. 형식: ax_contracts.schemas.data.MetricCatalog
# 스터디온 자기 API를 사이트 변환기로 shop-api 규격으로 바꿔 읽는다(수강 결제 = 주문).
# 변환기로 실제로 받을 수 있는 지표만 둔다. 결제 실패율·접속 지표는 API 형식을 확인한 뒤 더한다
id = "studyon"
name = "스터디온에듀"
connector = "shop-api"
volume_metric = "order_count"
volume_label = "수강 결제"

[[metrics]]
id = "order_count"
label = "수강 결제 수"
bad_direction = "down"  # 감소만 이상 (시험 시즌·할인으로 늘어난 것은 이상이 아님)
unit = "건"
aggregate = "sum"

[[metrics]]
id = "inquiry_count"
label = "질문·문의량"
bad_direction = "up"
unit = "건"
aggregate = "sum"

[[metrics]]
id = "cancel_count"
label = "취소 주문"
bad_direction = "up"  # 늘면 이상
unit = "건"
aggregate = "sum"

[[metrics]]
id = "refund_amount"
label = "환불액"
bad_direction = "up"
unit = "원"
aggregate = "sum"

[impact]
unit_label = "수강 결제"
customer_label = "수강생"
money_field = "amount"
money_unit = "원"
money_label = "결제 실패(미결제) 금액"

# 매출 분석(sales_analysis) 공통 설정 (11/25). 형식: ax_contracts.schemas.data.CatalogSales
# 사이트 변환기가 결제을 shop-api 판매 기록으로 바꿔 주므로 매출·객단가·재구매율은 업종과 상관없이 같은 식으로 센다.
# 분류·장르·회원 속성처럼 업종 전용 칸은 두지 않는다. 숫자는 코드가 판매 기록에서 계산한다
[sales]
version = "1"
revenue_definition = "매출 = 결제 완료 결제의 금액 − 할인 − 기간 안 환불"
min_product_orders = 5
max_staleness_minutes = 30
min_period_orders = 20
min_group_size = 5
active_days = 365

# 분류 이름 (11/26). 사이트 변환기가 넘기는 분류 값은 강의 분야 코드(DEV 등)와 패키지 줄의 종류 값(bundle, #1901)이고,
# 스터디온 /api/v1(courses.category)은 분야 이름을 주지 않는다(serialize.ts courseV1: category: c.category.code).
# 그래서 사이트 레포의 분야 정의를 그대로 옮긴다: study-on-edu prisma/seed-data/categories.ts CATEGORIES.
# bundle은 사이트 주문 항목의 종류 값(prisma OrderItem.kind: course·bundle)이고 사이트 화면도 "패키지"로 보인다
# (src/app/(site)/my/orders/[code]/page.tsx, CartView.tsx).
# 닫힌 목록이 아니다 — 여기 없는 새 분야는 사이트 값 그대로 보인다
[sales.category_names]
DEV = "개발·프로그래밍"
DATA = "데이터·AI"
CERT = "자격증"
LANG = "어학"
DSGN = "디자인"
BIZ = "비즈니스·마케팅"
EXAM = "수능·내신"
bundle = "패키지"

# 고객 속성 (11/26). 사이트 변환기가 고객사 주문 원본에서 꺼내는 code와 같다
# (dashboard-api `site_adapter/customer_attrs.py`: 성별 → female·male, 생년 → 연령대).
# 사이트가 이 값을 주지 않으면 고객·시장 분석은 "이 회사 사이트에서 받은 고객 속성이 없어요"로 멈춘다
# (다른 회사 값으로 채우지 않는다). 순서 = 화면 순서
[[sales.attributes]]
key = "age_band"
label = "연령대"
[sales.attributes.values]
10s = "10대"
20s = "20대"
30s = "30대"
40s = "40대"
50s_plus = "50대 이상"

[[sales.attributes]]
key = "gender"
label = "성별"
[sales.attributes.values]
female = "여성"
male = "남성"

# 고객 구성 지수(시장 커버)의 인구 통계 (연령대 × 성별, 11/26). 업종과 상관없는 공공 통계라 틀 기본값에 둔다.
# 출처·코드는 catbooks.toml과 같다: 행정안전부 주민등록인구통계, KOSIS "행정구역(읍면동)별/5세별 주민등록인구"
#   https://kosis.kr/statHtml/statHtml.do?orgId=101&tblId=DT_1B04005N (코드 확인 2026-11-16 getMeta)
# 사이트가 연령대·성별을 주지 않는 회사는 구매자 수가 없어 지수를 내지 않는다(다른 회사 값으로 채우지 않는다)
[[sales.population]]
attribute_keys = ["age_band", "gender"]
source_id = "kosis"

[sales.population.table_ref]
org_id = "101"
tbl_id = "DT_1B04005N"
label = "행정안전부 주민등록인구통계(KOSIS)"  # 작성 행정안전부, 제공 KOSIS
prd_se = "M"
new_est_prd_cnt = 1
obj_l1 = "00"
obj_l2 = "ALL"
itm_id = "ALL"
dims = { age_band = "c2", gender = "itm" }

[sales.population.table_ref.codes.age_band]
10s = ["15", "20"]
20s = ["25", "30"]
30s = ["35", "40"]
40s = ["45", "50"]
50s_plus = ["55", "60", "65", "70", "75", "80", "85", "90", "95", "100", "105"]

[sales.population.table_ref.codes.gender]
female = "T4"
male = "T3"

# 이벤트 종류 (11/26, 업종 무관). 할인율·전환율은 그 회사 지난 캠페인이 없을 때만 쓰는 가정 값이다.
# 근거: 공개된 업종별 값이 없어 캣북스 기본값(catbooks.toml)과 같은 값을 출발점으로 둔다(판단).
# 그 회사 캠페인 성과가 쌓이면 지난 결과(past_results)가 이 가정을 대신한다.
# 배송이 없는 업종(여행·교육)이 있어 무료 배송은 넣지 않는다
[[sales.event_kinds]]
code = "bundle_discount"
label = "묶음 할인"
discount_rate = 0.10  # 가정
conversion_low = 0.02  # 가정
conversion_high = 0.05  # 가정

[[sales.event_kinds]]
code = "genre_coupon"
label = "분류 쿠폰"
discount_rate = 0.15  # 가정
conversion_low = 0.03  # 가정
conversion_high = 0.07  # 가정

# 화면의 자주 묻는 질문 칩 (연령대·성별만: 공통 속성)
[[sales.quick_questions]]
label = "20대 여성"
filters = { age_band = "20s", gender = "female" }

[[sales.quick_questions]]
label = "30대 남성"
filters = { age_band = "30s", gender = "male" }

[[sales.quick_questions]]
label = "40대 여성"
filters = { age_band = "40s", gender = "female" }
