# 스터디온에듀(가상 고객사, 온라인 강의 플랫폼) 지표 카탈로그. 형식: ax_contracts.schemas.data.MetricCatalog
# 스터디온 자기 API를 사이트 변환기로 shop-api 규격으로 바꿔 읽는다(수강 결제 = 주문).
# 변환기로 실제로 받을 수 있는 지표만 둔다. 결제 실패율·접속 지표는 API 형식을 확인한 뒤 더한다
id = "studyon"
name = "스터디온에듀"
connector = "shop-api"
volume_metric = "order_count"
volume_label = "수강 결제"

[[metrics]]
id = "order_count"
label = "수강 결제 수"
bad_direction = "down"  # 감소만 이상 (시험 시즌·할인으로 늘어난 것은 이상이 아님)
unit = "건"
aggregate = "sum"

[[metrics]]
id = "inquiry_count"
label = "질문·문의량"
bad_direction = "up"
unit = "건"
aggregate = "sum"

[impact]
unit_label = "수강 결제"
customer_label = "수강생"
money_field = "amount"
money_unit = "원"
money_label = "결제 실패(미결제) 금액"
