label = "직업"
[sales.attributes.values]
student = "학생"
employee = "직장인"
self_employed = "자영업"
other = "기타"
no_answer = "응답 안 함"

# 속성 값 → 도서관 정보나루 인기대출(loanItemSrch) 조건.
# 출처: 도서관 정보나루 Open API 매뉴얼 v20260620, https://www.data4library.kr/downloadApiManual
#   - 요청 명세 10~11쪽: from_age(시작연령)·to_age(종료연령). "시작연령(from_age)만 있을 경우
#     종료연령(to_age)는 100세로 자동 설정"
#   - 코드표 58쪽 "성별 코드": 0 = 남성, 1 = 여성, 2 = 미상
# 성별 no_answer(응답 안 함)는 넣지 않는다: 매뉴얼의 2 = 미상은 "응답 안 함"과 같은 뜻이 아니다
# 연령 10s~40s: 매뉴얼 10~11쪽 from_age·to_age (https://www.data4library.kr/downloadApiManual)
[[sales.external_filters]]
source_id = "data4library"
attribute_key = "age_band"
value_code = "10s"
params = { from_age = 10, to_age = 19 }

[[sales.external_filters]]
source_id = "data4library"
attribute_key = "age_band"
value_code = "20s"
params = { from_age = 20, to_age = 29 }

[[sales.external_filters]]
source_id = "data4library"
attribute_key = "age_band"
value_code = "30s"
params = { from_age = 30, to_age = 39 }

[[sales.external_filters]]
source_id = "data4library"
attribute_key = "age_band"
value_code = "40s"
params = { from_age = 40, to_age = 49 }

# 50대 이상: from_age만 (to_age는 100세로 자동 설정, 매뉴얼 10~11쪽 https://www.data4library.kr/downloadApiManual)
[[sales.external_filters]]
source_id = "data4library"
attribute_key = "age_band"
value_code = "50s_plus"
params = { from_age = 50 }

# 성별 코드 0 = 남성, 1 = 여성 (매뉴얼 58쪽 "성별 코드", https://www.data4library.kr/downloadApiManual)
[[sales.external_filters]]
source_id = "data4library"
attribute_key = "gender"
value_code = "male"
params = { gender = "0" }

# 성별 코드 1 = 여성 (매뉴얼 58쪽 "성별 코드", https://www.data4library.kr/downloadApiManual)
[[sales.external_filters]]
source_id = "data4library"
attribute_key = "gender"
value_code = "female"
params = { gender = "1" }

# 장르 → 도서관 정보나루 kdc. 출처: 도서관 정보나루 Open API 매뉴얼 v20260620 코드표 59쪽
# "대주제 코드" (https://www.data4library.kr/downloadApiManual): 0 총류, 1 철학, 2 종교,
# 3 사회과학, 4 자연과학, 5 기술과학, 6 예술, 7 언어, 8 문학, 9 역사.
# 장르 이름과 대주제 이름이 같은 주제일 때만 넣는다.
# 넣지 않은 장르 (미확인):
#   - it(AI·IT): 0 총류는 컴퓨터과학(KDC 004) 말고도 백과사전·연속간행물 등을 다 담는다. 매뉴얼
#     표에는 2자리 세부주제까지만 있어 004를 고를 수 없으므로 근사로 넣지 않는다
#   - self_help(자기계발): 매뉴얼 대주제·세부주제 표에 맞는 분류가 없음
#   - humanities(인문): KDC 분류 하나가 아님 (철학·역사·언어 등에 걸침)
#   - comics(만화): 매뉴얼 표에 없음 (65 회화·도화는 만화가 아님)
#   - kids(어린이): KDC 주제가 아님. 매뉴얼 58~59쪽 ISBN 부가기호(addCode) 7 = 아동이 있지만
#     커넥터 popular_loans가 addCode를 받지 않아 넣지 않는다
#   - hobby(여행·취미): 분류 하나로 정할 수 없음
#   - writing·notebook·deco: 문구라 도서 분류가 아님
# business(경제경영)는 매뉴얼 세부주제 32 경제학이 있지만 커넥터가 dtl_kdc를 받지 않아 kdc 3만 쓴다
[[sales.genre_external]]
source_id = "data4library"
genre_code = "novel"
params = { kdc = "8" }  # 8 문학 (매뉴얼 59쪽, https://www.data4library.kr/downloadApiManual)

[[sales.genre_external]]
source_id = "data4library"
genre_code = "essay"
params = { kdc = "8" }  # 8 문학 (매뉴얼 59쪽, https://www.data4library.kr/downloadApiManual)

[[sales.genre_external]]
source_id = "data4library"
genre_code = "business"
params = { kdc = "3" }  # 3 사회과학 (매뉴얼 59쪽, https://www.data4library.kr/downloadApiManual)

[[sales.genre_external]]
source_id = "data4library"
genre_code = "society"
params = { kdc = "3" }  # 3 사회과학 (매뉴얼 59쪽, https://www.data4library.kr/downloadApiManual)

[[sales.genre_external]]
source_id = "data4library"
genre_code = "history"
params = { kdc = "9" }  # 9 역사 (매뉴얼 59쪽, https://www.data4library.kr/downloadApiManual)

[[sales.genre_external]]
source_id = "data4library"
genre_code = "science"
params = { kdc = "4" }  # 4 자연과학 (매뉴얼 59쪽, https://www.data4library.kr/downloadApiManual)

[[sales.genre_external]]
source_id = "data4library"
genre_code = "language"
params = { kdc = "7" }  # 7 언어 (매뉴얼 59쪽, https://www.data4library.kr/downloadApiManual)

# 시장 커버 비율의 인구 통계 (연령대 × 성별, KOSIS). table_ref는 비워 둔다 (미확인):
# KOSIS 연령×성별 주민등록인구 표 id를 확인하지 못함 (KOSIS 표 화면이 로그인(SSO)으로 넘어가
