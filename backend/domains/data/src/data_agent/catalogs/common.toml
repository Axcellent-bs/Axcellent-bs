# 틀 기본 지표 카탈로그 (11/25): 회사 설정이 정해지지 않은 회사가 쓴다(config/frame/tenant.toml).
# 형식: ax_contracts.schemas.data.MetricCatalog
# 사이트 변환기가 회사 API를 shop-api 규격으로 바꿔 주므로, 그 규격으로 어느 회사나 받을 수 있는 지표만 둔다.
# 업종 전용 칸(장르·분류·판매 세부)은 두지 않는다(캣북스 서점 문구가 다른 회사에 나오지 않게).
id = "common"
name = "기본"
connector = "shop-api"
volume_metric = "order_count"
volume_label = "주문"

[[metrics]]
id = "order_count"
label = "주문 수"
bad_direction = "down"  # 감소만 이상
unit = "건"
aggregate = "sum"

[[metrics]]
id = "inquiry_count"
label = "문의량"
bad_direction = "up"
unit = "건"
aggregate = "sum"

[[metrics]]
id = "cancel_count"
label = "취소 주문"
bad_direction = "up"  # 늘면 이상
unit = "건"
aggregate = "sum"

[[metrics]]
id = "refund_amount"
label = "환불액"
bad_direction = "up"
unit = "원"
aggregate = "sum"

[impact]
unit_label = "주문"
customer_label = "고객"
money_field = "amount"
money_unit = "원"
money_label = "결제 실패(미결제) 금액"

# 매출 분석(sales_analysis) 공통 설정 (11/25). 형식: ax_contracts.schemas.data.CatalogSales
# 사이트 변환기가 주문을 shop-api 판매 기록으로 바꿔 주므로 매출·객단가·재구매율은 업종과 상관없이 같은 식으로 센다.
# 분류·장르·회원 속성처럼 업종 전용 칸은 두지 않는다. 숫자는 코드가 판매 기록에서 계산한다
[sales]
version = "1"
revenue_definition = "매출 = 결제 완료 주문의 금액 − 할인 − 기간 안 환불"
min_product_orders = 5
max_staleness_minutes = 30
min_period_orders = 20
min_group_size = 5
active_days = 365
item_noun = "상품"
