# 판매자 정산 정책 (고객지원). 2026-11-12 재무에서 옮겨 왔다(팀장 결정: 판매자 정산은 고객지원이 하고
# 재무는 결과를 받아 보여 준다). 값은 옮기기 전 재무 finance_policy.toml과 같다.
# 판매 수수료율은 재무도 매출(수수료 매출)을 셀 때 쓴다. 바꿀 때는 재무 finance_policy.toml과 같이 바꾼다.

[commission]
default_rate = 0.10                 # 기본 판매 수수료 10%
[commission.category_rates]
book = 0.10                         # 도서 10%
stationery = 0.08                   # 문구 8%

[settlement]
pay_days_after_period_end = 6       # 지급일 = 정산 기간 마지막 날(일) + 6일
# 지급 기한 점검. 판매 대금 지급이 늦어지지 않게 경보만 낸다.
# 근거(2026-10-30 확인): 오픈마켓(중개)은 대규모유통업법 개정(2026-09-17 본회의, 특약매입 등 월 판매마감일+20일)
# 대상이 아니다. 중개 정산기한은 공정위 온라인플랫폼 법안(구매확정일+20일, 판매대금 50% 별도관리)이 계류 중이다.
# 그래서 법이 시행되기 전에도 "구매 확정일부터 20일"을 선제 관리 기준으로 둔다. 법이 확정되면 PR로 바꾼다.
deadline_days = 20                  # 구매 확정일부터 이 날 안에 지급
deadline_basis = "구매 확정일(배송 완료 시각으로 대신함)부터 (온라인플랫폼 정산 법안 계류 중, 선제 기준)"
deadline_warn_days = 5              # 기한까지 이 날 이하로 남으면 "임박"
deadline_lookback_days = 70         # 이 기간 안에 결제된 주문을 본다

[rule]
id = "SET-001"
title = "판매자 정산금 계산"
statement = "정산금 = 판매액 − 판매 수수료 − 판매자 부담 쿠폰 − 환불. 판매액은 그 주에 구매가 확정된(배송 완료) 주문으로 센다. 확정 전 주문은 확정되는 주의 정산으로 넘긴다. 환불은 이미 확정된 주문이면 환불한 주에, 확정 전 환불이면 그 주문이 확정되는 주에 빼고, 끝내 확정되지 않은 주문(배송 전 취소 등)의 환불은 빼지 않는다."
basis = "내부 정산 기준 (재무 재설계 2026-10-23, 고객지원 이관 2026-11-12). 판매자 약관 확인 필요"
review = "pending"
version = 1
