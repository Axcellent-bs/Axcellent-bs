[project]
name = "ax-secret-store"
version = "0.1.0"
description = "secret-store — 비밀값(API 키·토큰) 암호화 저장소, 스위치 AX_SECRET_STORE=env|db"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=42",
]

[project.scripts]
ax-secret-store = "ax_secret_store.migrate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ax_secret_store"]
