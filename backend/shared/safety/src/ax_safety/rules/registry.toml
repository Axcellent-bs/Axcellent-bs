# 코딩 에이전트 (개발팀원이 쓴 기획). 작업 등록·다시 시도와 리뷰 뒤 수정 커밋은 A.
# 첫 커밋·PR은 generate_pr(B), 리뷰는 review_pr, 머지는 merge_pr(B) 관문을 그대로 지난다
[[actions]]
action = "dev_task_create"
owner = "planning"
requesters = ["planning", "dev"]
base_grade = "A"

[[actions]]
action = "dev_task_retry"
owner = "planning"
requesters = ["planning", "dev"]
base_grade = "A"

# 개발자 Claude 대기 작업을 서버 AI로 넘기기 (아무도 안 가져간 것만). 코드를 안 바꿔 A
[[actions]]
action = "dev_task_to_agent"
owner = "planning"
requesters = ["planning", "dev"]
base_grade = "A"

# 코딩 작업 반영됨으로 닫기 (바뀐 내용 없음 → 앞 작업 PR이 반영, PR 없이 완료). 코드를 안 바꿔 A
[[actions]]
action = "dev_task_covered"
owner = "planning"
requesters = ["planning", "dev"]
base_grade = "A"

# 코딩 작업 사람 중단 (열린 PR 닫기·브랜치 지우기). 병합된 것은 건드리지 않아 A
[[actions]]
action = "dev_task_cancel"
connection_field = "connection_id"
owner = "planning"
requesters = ["planning", "dev"]
base_grade = "A"

# 사람이 개발 작업을 기획에 돌려보내기 (코드 변경이 아닌 일). 열린 PR은 닫고(머지 안 됨) 기록만 남겨 A
[[actions]]
action = "dev_task_return"
owner = "planning"
requesters = ["planning", "dev"]
base_grade = "A"

# 멈춘 코딩 작업 사람 폐기 (중단·실패·돌려보낸 작업, 열린 PR 없음). 기록에 표시만 해서 A
[[actions]]
action = "dev_task_discard"
owner = "planning"
requesters = ["planning", "dev"]
base_grade = "A"

# 대기 중인 코딩 PR에 사람이 수정 지시 (같은 PR에 커밋을 더한다, 머지는 그대로 merge_pr 관문) A
[[actions]]
action = "dev_task_revise"
owner = "planning"
requesters = ["planning", "dev"]
base_grade = "A"

[[actions]]
action = "code_write"
connection_field = "connection_id"
owner = "planning"
requesters = ["planning", "dev"]
base_grade = "A"

# 구독형 작업: 개발자 본인 Claude가 작업을 가져가기·내려놓기(임대 만료 포함). 기록만 바뀌어 A.
# 개발자가 올린 PR을 잇는 건 generate_pr(B), 머지는 merge_pr(B) 관문을 그대로 지난다
[[actions]]
action = "dev_task_claim"
owner = "planning"
