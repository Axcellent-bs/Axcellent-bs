# 액션 등급 레지스트리 (SAF-02, 공통 구성안 7장 "액션 등급 신고").
#
# 각 부서가 신고한 상태 변경 액션의 기본 등급·검증자·금액 필드다. 사람만 바꾼다(PR).
# Agent Card의 grade·verifier와 다르면 이 파일이 우선한다.
#
# - owner: 이 액션을 execute()로 요청할 수 있는 유일한 에이전트 (토큰의 requester와 같아야 한다)
# - base_grade: A | B | C. 금액 기준(thresholds.toml)이 더 높으면 그쪽을 쓴다
# - verifier, verify_skill: B 교차검증 주체와 그 skill. owner와 같으면 등록을 거부한다
# - amount: 금액 계산 방법. count_field × unit_field 또는 amount_field 하나
#   claimed_fields는 요청 쪽이 적어 보낸 총액 필드다. 코드 계산값과 다르면 C(amount_mismatch)
# - on_verify_reject: 에이전트 검증자가 거절했을 때 "reject"(기본, 바로 rejected) | "hold"(사람 보류 큐 C)
# - customer_field, purpose_field: 누적 기준(고객당·사건당 보상)에 쓰는 필드
# - connection_field: 외부 연결에 쓰는 액션의 연결 id 필드. 비어 있으면 C(schema_invalid).
#   목록은 개발 서비스 `dev_agent/external_actions.py`와 같아야 한다 (시험이 대조한다)

# ---- 마케팅 (재헌)
[[actions]]
action = "publish_notice"
owner = "marketing"
base_grade = "A"

# 기획이 확정해 넘긴 기획안 받기 (#552). 마케팅이 자기 보관함에 쓰는 일이라 요청자는 owner(마케팅)다.
# 기획은 A2A로 이 skill을 부를 뿐 관문에 직접 요청하지 않는다. 누가 부를지는 Agent Card가 막는다
[[actions]]
action = "receive_campaign_brief"
owner = "marketing"
base_grade = "A"

# 인스타그램 게시 (#487). 외부 고객에게 공개되고 되돌리기 어려워 늘 사람이 정한다.
# B로 내리는 것은 게시 규칙이 검증된 뒤 사람이 정한다
[[actions]]
action = "publish_sns"
owner = "marketing"
base_grade = "C"

# 캠페인 예산 집행. 재무가 남은 예산·실패 이력·현금으로 검증한다. 거절하면 집행하지 않는다.
# 재무 검증은 이 캠페인 예산에만 쓴다. 쿠폰·환불은 재무가 검증하지 않는다(재무 재설계 원칙)
[[actions]]
action = "start_campaign"
owner = "marketing"
base_grade = "B"
verifier = "finance"
verify_skill = "verify_campaign_budget"
amount = { amount_field = "budget_krw" }

# 이미지·영상 생성 (#487, #677). 유료 API라 안전 레이어 코드 규칙이 비용·길이를 본다.
# 통과하면 B로 실행. 금액은 마케팅 코드가 공급자 단가표로 계산해 보낸 cost_krw다.
# 매체 종류 media_kind(image | video)에 따라 건당 상한과 길이 규칙이 다르다(thresholds.toml)
[[actions]]
action = "generate_media"
owner = "marketing"
base_grade = "B"
verifier = "safety"
amount = { amount_field = "cost_krw", claimed_fields = ["claimed_cost_krw"] }

# 사람과 마케팅 AI의 직접 대화. 대화 글을 저장하고 닫을 뿐 쿠폰·공지·게시는 건드리지 않는다
# (그런 일은 기존 skill로 execute()와 안전 관문을 거친다). 고객지원·기획 대화와 같은 A
[[actions]]
action = "marketing_chat_send"
owner = "marketing"
base_grade = "A"

[[actions]]
action = "marketing_chat_close"
owner = "marketing"
base_grade = "A"

# 쿠폰·환불은 A (재무 재설계 2026-10-23, docs/notes/finance/2026-10-23-finance-redesign.md 4장).
# 건별 검사는 이 관문의 코드 규칙이 한다: 금액 계산, claimed_fields 불일치(C), 기준표 한도(C).
# 재무는 쿠폰·환불의 끝난 금액을 장부에 기록만 한다.
[[actions]]
action = "issue_coupon"
owner = "marketing"
base_grade = "A"
customer_field = "buyer_id"
purpose_field = "purpose_code"
amount = { count_field = "count", unit_field = "unit_value", claimed_fields = ["total_value", "claimed_total"] }

