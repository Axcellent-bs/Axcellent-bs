base_grade = "A"

[[actions]]
action = "split_tasks"
owner = "planning"
base_grade = "A"

[[actions]]
action = "review_pr"
connection_field = "connection_id"
owner = "planning"
base_grade = "A"

[[actions]]
action = "send_message"
owner = "planning"
base_grade = "A"

# 사건을 PR·기획서에 연결 (SCN-A 대응 단계). 개발 기록만 바꾸고 돈·배포에 닿지 않아 A (Agent Card grade A)
[[actions]]
action = "link_incident"
owner = "planning"
base_grade = "A"

# 자동 처리 범위 바꾸기. 줄이기는 A(승인 없이), 넓히기는 C(사람 확인).
# - 줄이기: 자동 머지 PR이 사건에 연결되면 한 단계 내린다 (예: L1 → L0). params {target, to}
# - 넓히기: 관리자 승인으로 범위를 올린다. params {target, to, lines, files, paths}
# 어느 쪽인지는 thresholds.toml의 auto_policy_* 규칙이 target("L1->L0" 형식)과 to로 가린다.
# 목록에 없는 단계 이동이거나 target·to가 없거나 형식이 틀리면 C (fail-closed)
[[actions]]
action = "auto_policy_update"
owner = "planning"
base_grade = "A"

# 기획서 확정은 A. 열린 질문·기각 경고·근거 없음·되돌릴 수 없는 영역이면 C (thresholds.toml)
[[actions]]
action = "confirm_spec"
owner = "planning"
base_grade = "A"

# PR 머지는 B, 검증자 = 코드 규칙(generate_pr와 같은 크기·경로 기준 + 검수 불일치·장애 연결·되돌릴 수 없는 영역)
[[actions]]
action = "merge_pr"
connection_field = "connection_id"
owner = "planning"
base_grade = "B"
verifier = "safety"

# 레포 작업 공간 (개발 화면에서 사람이 PR·브랜치를 직접 다룬다, 사람 토큰).
# 머지는 위 merge_pr(B) 관문 그대로. 되돌리기 PR은 병합된 변경을 뒤집는 새 PR이라 merge_pr처럼 B,
# 검증자 = 같은 크기·경로 코드 규칙. 닫기·다시 열기·코멘트·브랜치 지우기는 병합된 코드를 바꾸지 않아 A
