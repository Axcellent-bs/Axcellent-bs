# 기준 금액 등급표 (SAF-02). 원본은 재무 기준표 v1, 공통 구성안 13장 결정 5번.
#
# 모든 값은 시작값이다. 바꾸면 version을 올린다. 사람만 바꾼다(PR). 에이전트는 조회만 한다.
# 규칙에 걸리면 C, 아니면 레지스트리 기본 등급을 쓴다.
#
# metric:
# - amount: 이번 요청의 코드 계산 금액
# - unit: 이번 요청의 단가
# - daily_total: 같은 tenant·같은 액션의 오늘(UTC) 실행 누적 + 이번 금액
# - context_total: 같은 context_id·같은 액션의 실행 누적 + 이번 금액
# - customer_total: 같은 context_id·같은 고객의 실행 누적 + 이번 금액
# - param·paths_within·paths_avoid: 금액이 아닌 규칙(아래 각 규칙 주석 참고)
# op: ">=", ">", "<=", "<". when은 params가 이 값일 때만 규칙을 적용한다.

version = 1

# B 교차검증 응답 마감(초). 넘으면 실행하지 않고 C 보류
verify_timeout_seconds = 30

# C 보류 건을 사람이 결정하지 않으면 자동 거절하는 시간(초). 데모 10분
review_timeout_seconds = 600

[[rules]]
key = "coupon_total"
action = "issue_coupon"
metric = "amount"
op = ">="
value = 300000

[[rules]]
key = "coupon_unit"
action = "issue_coupon"
metric = "unit"
op = ">"
value = 20000

[[rules]]
key = "coupon_daily"
action = "issue_coupon"
metric = "daily_total"
op = ">="
value = 1000000

[[rules]]
key = "compensation_per_context"
action = "issue_coupon"
metric = "context_total"
op = ">="
value = 1000000
when = { purpose_code = "compensation" }

[[rules]]
key = "compensation_per_customer"
action = "issue_coupon"
metric = "customer_total"
op = ">="
value = 50000
when = { purpose_code = "compensation" }

[[rules]]
key = "refund_single"
action = "refund_request"
metric = "amount"
op = ">="
value = 100000

# ---- 금액이 아닌 규칙. 아래 값은 모두 제안값(담당 확인 전)
[[rules]]
key = "seller_risk"
action = "seller_review"
metric = "param"
field = "risk_score"
op = ">="
value = 70

[[rules]]
key = "pr_changed_lines"
action = "generate_pr"
metric = "param"
field = "changed_lines"
op = ">"
value = 300

[[rules]]
key = "pr_changed_files"
action = "generate_pr"
metric = "param"
field = "changed_files"
op = ">"
value = 20

[[rules]]
key = "pr_allowed_paths"
action = "generate_pr"
metric = "paths_within"
field = "changed_paths"
allowed = ["shop-api/", "shop-web/", "docs/"]

# 보호 경로 (#169, 안전 담당). 결제·인증·데이터에 닿는 변경은 허용 경로·크기 안이어도
# planning이 보낸 irreversible_count와 상관없이 항상 C. 값은 제안값.
# 경로는 ax-backend·ax-frontend 저장소 루트 기준. 같은 경로이거나 그 접두사로 시작하면 걸린다.
# 필드가 없거나 문자열 목록이 아니면 걸린 것으로 본다(fail-closed).
[[rules]]
key = "pr_protected_paths"
action = "generate_pr"
metric = "paths_avoid"
field = "changed_paths"
protected = [
  # shop-web (ax-frontend): 결제 화면, 로그인·인증, API 클라이언트, 환경값
  "shop-web/src/pages/Checkout.tsx",
  "shop-web/src/lib/auth.tsx",
  "shop-web/src/lib/api.ts",
  "shop-web/src/lib/env.ts",
  # shop-api: DB 스키마, 주문·결제 로직, 쿠폰 지급 로직, 시드 데이터
  "shop-api/src/ax_shop_api/db.py",
  "shop-api/src/ax_shop_api/service.py",
  "shop-api/src/ax_shop_api/promotions.py",
  "shop-api/src/ax_shop_api/seed.py",
  # 관문 규칙·CI·계약. 허용 경로 밖이지만 허용 목록이 넓어져도 막히도록 같이 둔다
  ".github/",
  "safety/",
  "contracts/",
]

# ---- 기획개발 자동화 (#166). 값은 제안값. params 키는 planning이 맞춰 보낸다.
# 필드가 없거나 정수가 아니면 걸린 것으로 본다(fail-closed).
[[rules]]
key = "spec_open_question"
action = "confirm_spec"
metric = "param"
field = "open_questions"
op = ">"
value = 0

[[rules]]
key = "spec_rejected_warning"
action = "confirm_spec"
metric = "param"
field = "warnings"
op = ">"
value = 0

[[rules]]
key = "spec_no_basis"
action = "confirm_spec"
metric = "param"
field = "basis_count"
op = "<"
value = 1

# 되돌릴 수 없는 영역(결제 데이터 삭제, 개인정보, 실제 송금 연동 등)에 닿는 항목 수. 0이 아니면 항상 C
[[rules]]
key = "irreversible"
action = "confirm_spec"
metric = "param"
field = "irreversible_count"
op = ">"
value = 0

# ---- 인사 (#180). 값은 제안값. 필드가 없거나 정수가 아니면 걸린 것으로 본다(fail-closed).
# 인수인계 완성도(0~100 정수 %). 기준 미만이면 confirm_handover도 C
[[rules]]
key = "handover_completeness"
action = "confirm_handover"
metric = "param"
field = "completeness_percent"
op = "<"
value = 80

# merge_pr: generate_pr와 같은 크기·경로 기준. 규칙 키는 파일 안에서 겹치지 않게 merge_ 접두사
[[rules]]
key = "merge_changed_lines"
action = "merge_pr"
metric = "param"
field = "changed_lines"
op = ">"
value = 300

[[rules]]
key = "merge_changed_files"
action = "merge_pr"
metric = "param"
field = "changed_files"
op = ">"
value = 20

[[rules]]
key = "merge_allowed_paths"
action = "merge_pr"
metric = "paths_within"
field = "changed_paths"
allowed = ["shop-api/", "shop-web/", "docs/"]

# 보호 경로: pr_protected_paths와 같은 목록. 값은 제안값
[[rules]]
key = "merge_protected_paths"
action = "merge_pr"
metric = "paths_avoid"
field = "changed_paths"
protected = [
  # shop-web (ax-frontend): 결제 화면, 로그인·인증, API 클라이언트, 환경값
  "shop-web/src/pages/Checkout.tsx",
  "shop-web/src/lib/auth.tsx",
  "shop-web/src/lib/api.ts",
  "shop-web/src/lib/env.ts",
  # shop-api: DB 스키마, 주문·결제 로직, 쿠폰 지급 로직, 시드 데이터
  "shop-api/src/ax_shop_api/db.py",
  "shop-api/src/ax_shop_api/service.py",
  "shop-api/src/ax_shop_api/promotions.py",
  "shop-api/src/ax_shop_api/seed.py",
  # 관문 규칙·CI·계약. 허용 경로 밖이지만 허용 목록이 넓어져도 막히도록 같이 둔다
  ".github/",
  "safety/",
  "contracts/",
]

[[rules]]
key = "pr_review_mismatch"
action = "merge_pr"
metric = "param"
field = "review_mismatch_count"
op = ">="
value = 2

[[rules]]
key = "pr_linked_incident"
action = "merge_pr"
metric = "param"
field = "linked_incident_count"
op = ">"
value = 0
# 교차검증 근거(cross_check = true)가 붙으면 아래 merge_cross_* 규칙 넷으로 대신 본다
unless = { cross_check = true }

# ---- merge_pr 교차검증 (다른 부서 근거로 판정). 개발 AI가 근거를 모아 cross_check = true와 함께 보낸다.
# - 근거가 대신하는 것은 "장애 났던 경로"(pr_linked_incident) 하나뿐이다. 크기·허용 경로·보호 경로·
#   검수 불일치·되돌릴 수 없는 영역은 코드 위험이라 운영 근거로 풀지 않는다 (걸리면 그대로 C)
# - 하나라도 걸리면 C(사람 확인). 진행 중인 사건과 겹쳐도 자동 거절하지 않는다: 그 PR이 장애
#   수정일 수 있어서, 거절 대신 사람이 본다 (보고서의 rules에 걸린 규칙이 남는다)
# - 필드가 없거나 형식이 틀리면 걸린 것으로 본다(fail-closed). 서비스를 안 고른 회사는 근거를 못
#   모으므로 evidence_missing으로 사람 확인
# - 시간 창(데이터분석 24시간, 같은 경로 장애 7일)과 근거별 대기(30초)는 개발 AI가 근거를 모을 때
#   쓰는 값이다. 관문은 그 결과만 본다
# 진행 중인 사건과 바뀐 경로의 구성요소가 겹치는 수 (총괄 find_active_incident)
[[rules]]
key = "merge_cross_active_incident"
action = "merge_pr"
metric = "param"
field = "active_incident_overlap"
op = ">"
value = 0
when = { cross_check = true }

# 데이터분석 anomaly_detection 최근 24시간 판정. "normal"만 통과 ("anomaly"·"unknown"은 사람 확인)
[[rules]]
key = "merge_cross_data_verdict"
action = "merge_pr"
metric = "param_in"
field = "data_verdict"
allowed = ["normal"]
when = { cross_check = true }

# 같은 경로의 최근 7일 장애·revert 수
[[rules]]
key = "merge_cross_recent_incident"
action = "merge_pr"
metric = "param"
field = "recent_incident_count"
op = ">"
value = 0
when = { cross_check = true }

# 모으지 못한 근거 수 (서비스 꺼짐·호출 실패·30초 안에 응답 없음)
[[rules]]
key = "merge_cross_evidence_missing"
action = "merge_pr"
metric = "param"
field = "evidence_missing"
op = ">"
value = 0
when = { cross_check = true }

[[rules]]
key = "merge_irreversible"
action = "merge_pr"
metric = "param"
field = "irreversible_count"
op = ">"
value = 0

# ---- 인프라 롤백 (SCN-A, docs/notes/safety/rollback-paths.md). 값은 인프라 합의값.
# params는 infra-dejafix가 코드로 계산해 보낸다(handlers.path_params). 하나라도 걸리면 C(사람 승인),
# 넷 다 통과(1·0·0·0)하면 B로 planning verify_rollback_target 교차검증.
# 필드가 없거나 0 이상 정수가 아니면 걸린 것으로 본다(fail-closed).
# 원인 후보 배포 수. 후보가 여러 개면 C
[[rules]]
key = "rollback_multiple_suspects"
action = "rollback_deployment"
metric = "param"
field = "suspect_count"
op = ">"
value = 1

# 원인 확신도가 high가 아니면 1. 1이면 C
[[rules]]
key = "rollback_low_confidence"
action = "rollback_deployment"
metric = "param"
field = "low_confidence"
op = ">"
value = 0

# 되돌릴 대상 배포의 되돌릴 수 없는 변경(DB 마이그레이션 등) 수. 0이 아니면 C
[[rules]]
key = "rollback_irreversible"
action = "rollback_deployment"
metric = "param"
field = "irreversible_count"
op = ">"
value = 0

# 같은 사건에서 이미 실행한 롤백 수. 두 번째 롤백부터 C
[[rules]]
key = "rollback_repeat"
action = "rollback_deployment"
metric = "param"
field = "prior_rollbacks"
op = ">"
value = 0
