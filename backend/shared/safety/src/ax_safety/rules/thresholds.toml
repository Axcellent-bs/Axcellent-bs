# 기준 금액 등급표 (SAF-02). 원본은 재무 기준표 v1, 공통 구성안 13장 결정 5번.
#
# 모든 값은 시작값이다. 바꾸면 version을 올린다. 사람만 바꾼다(PR). 에이전트는 조회만 한다.
# 규칙에 걸리면 C, 아니면 레지스트리 기본 등급을 쓴다.
#
# metric:
# - amount: 이번 요청의 코드 계산 금액
# - unit: 이번 요청의 단가
# - daily_total: 같은 tenant·같은 액션의 오늘(UTC) 실행 누적 + 이번 금액
# - context_total: 같은 context_id·같은 액션의 실행 누적 + 이번 금액
# - customer_total: 같은 context_id·같은 고객의 실행 누적 + 이번 금액
# - daily_count: 같은 tenant·같은 액션의 오늘(UTC) 실행 건수 + 이번 1건
# - param·paths_within·paths_avoid·paths_named: 금액이 아닌 규칙(아래 각 규칙 주석 참고)
# op: ">=", ">", "<=", "<". when은 params가 이 값일 때만 규칙을 적용한다.

version = 6

# B 교차검증 응답 마감(초). 넘으면 실행하지 않고 C 보류
verify_timeout_seconds = 30

# C 보류 건을 사람이 결정하지 않으면 자동 거절하는 시간(초). 데모 10분
review_timeout_seconds = 600

[[rules]]
key = "coupon_total"
action = "issue_coupon"
metric = "amount"
op = ">="
value = 300000

[[rules]]
key = "coupon_unit"
action = "issue_coupon"
metric = "unit"
op = ">"
value = 20000

[[rules]]
key = "coupon_daily"
action = "issue_coupon"
metric = "daily_total"
op = ">="
value = 1000000

[[rules]]
key = "compensation_per_context"
action = "issue_coupon"
metric = "context_total"
op = ">="
value = 1000000
when = { purpose_code = "compensation" }

[[rules]]
key = "compensation_per_customer"
action = "issue_coupon"
metric = "customer_total"
op = ">="
value = 50000
when = { purpose_code = "compensation" }

[[rules]]
key = "refund_single"
action = "refund_request"
metric = "amount"
op = ">="
value = 100000

# ---- 금액이 아닌 규칙. 아래 값은 모두 제안값(담당 확인 전)
[[rules]]
key = "pr_changed_lines"
action = "generate_pr"
metric = "param"
field = "changed_lines"
op = ">"
value = 300

[[rules]]
key = "pr_changed_files"
action = "generate_pr"
metric = "param"
field = "changed_files"
op = ">"
value = 20

[[rules]]
key = "pr_allowed_paths"
action = "generate_pr"
metric = "paths_within"
field = "changed_paths"
allowed = ["shop-api/", "shop-web/", "docs/"]

# 보호 경로 (#169, 안전 담당). 결제·인증·데이터에 닿는 변경은 허용 경로·크기 안이어도
# planning이 보낸 irreversible_count와 상관없이 항상 C. 값은 제안값.
# 경로는 ax-backend·ax-frontend 저장소 루트 기준. 같은 경로이거나 그 접두사로 시작하면 걸린다.
# 필드가 없거나 문자열 목록이 아니면 걸린 것으로 본다(fail-closed).
[[rules]]
key = "pr_protected_paths"
action = "generate_pr"
metric = "paths_avoid"
field = "changed_paths"
protected = [
  # shop-web (ax-frontend): 결제 화면, 로그인·인증, API 클라이언트, 환경값
  "shop-web/src/pages/Checkout.tsx",
  "shop-web/src/lib/auth.tsx",
  "shop-web/src/lib/api.ts",
  "shop-web/src/lib/env.ts",
  # shop-api: DB 스키마, 주문·결제 로직, 쿠폰 지급 로직, 시드 데이터
  "shop-api/src/ax_shop_api/db.py",
  "shop-api/src/ax_shop_api/service.py",
  "shop-api/src/ax_shop_api/promotions.py",
  "shop-api/src/ax_shop_api/seed.py",
  # 관문 규칙·CI·계약. 허용 경로 밖이지만 허용 목록이 넓어져도 막히도록 같이 둔다
  ".github/",
  "safety/",
  "contracts/",
]

# 에이전트 설정·훅·설치 스크립트 (#506). 머지되면 이 레포를 여는 개발자의 Claude Code·Codex·에디터나
# CI가 자동으로 읽고 실행하는 파일이라 AI가 만든 PR이 바꾸면 항상 C. 경로 앞부분이 아니라 이름으로
# 잡으므로 깊이와 상관없다(shop-web/CLAUDE.md). 대소문자를 가리지 않고, \ 구분자·./·끝의 /와 Windows가
# 무시하는 끝의 점·공백·:스트림도 같은 이름으로 본다. 필드가 없거나 문자열 목록이 아니면 걸린 것으로
# 본다(fail-closed). 개발 쪽 AGENT_CONFIG_DIRS·AGENT_CONFIG_FILES와 맞춘다. 세 규칙의 목록은 같다.
[[rules]]
key = "pr_agent_config_paths"
action = "generate_pr"
metric = "paths_named"
field = "changed_paths"
names = [
  # 코딩 에이전트 지시·설정 (폴더)
  ".claude", ".codex", ".cursor", ".gemini", ".agents", ".agent", ".kiro", ".windsurf", ".roo",
  ".continue", ".amazonq", ".opencode", ".factory",
  # 코딩 에이전트 지시·설정 (파일)
  "CLAUDE.md", "AGENTS.md", "GEMINI.md", ".mcp.json", ".cursorrules", ".clinerules", ".windsurfrules",
  "copilot-instructions.md", ".aider.conf.yml",
  # 에디터·개발 환경이 열 때 실행 (.devcontainer.json은 폴더 없이 쓰는 형태)
  ".vscode", ".devcontainer", ".devcontainer.json", ".idea", ".run", ".envrc", ".env",
  # git 훅·하위 저장소
  ".husky", ".githooks", ".pre-commit-config.yaml", ".gitmodules",
  # CI
  ".github", ".gitlab", ".gitlab-ci.yml", ".circleci", "Jenkinsfile", "azure-pipelines.yml",
  "bitbucket-pipelines.yml",
  # 설치·빌드 스크립트
  "package.json", "pyproject.toml", "setup.py", "setup.cfg", "composer.json", "Gemfile", "Pipfile",
  "requirements.txt", "Makefile", "GNUmakefile", "Dockerfile", "Taskfile.yml", "Taskfile.yaml",
  # 테스트 도구가 자동으로 실행
  "conftest.py", "tox.ini", "noxfile.py",
  # 패키지 관리자 설정 (받는 곳을 바꾸거나 설치 때 코드를 실행)
  ".npmrc", ".yarnrc", ".yarnrc.yml", ".pnpmfile.cjs", "pnpm-workspace.yaml", "bunfig.toml", "uv.toml",
  "pip.conf",
  # 잠금 파일 (받을 주소를 바꿔치기할 수 있다)
  "package-lock.json", "npm-shrinkwrap.json", "pnpm-lock.yaml", "yarn.lock", "bun.lock", "bun.lockb",
  "uv.lock", "poetry.lock", "Pipfile.lock", "composer.lock", "Gemfile.lock",
]

# ---- 기획·개발 자동화 (#166). 값은 제안값. params 키는 planning이 맞춰 보낸다.
# 필드가 없거나 정수가 아니면 걸린 것으로 본다(fail-closed).
[[rules]]
key = "spec_open_question"
action = "confirm_spec"
metric = "param"
field = "open_questions"
op = ">"
value = 0

[[rules]]
key = "spec_rejected_warning"
action = "confirm_spec"
metric = "param"
field = "warnings"
op = ">"
value = 0

[[rules]]
key = "spec_no_basis"
action = "confirm_spec"
metric = "param"
field = "basis_count"
op = "<"
value = 1

# 되돌릴 수 없는 영역(결제 데이터 삭제, 개인정보, 실제 송금 연동 등)에 닿는 항목 수. 0이 아니면 항상 C
[[rules]]
key = "irreversible"
action = "confirm_spec"
metric = "param"
field = "irreversible_count"
op = ">"
value = 0

# ---- 인사 (#180). 값은 제안값. 필드가 없거나 정수가 아니면 걸린 것으로 본다(fail-closed).
# 인수인계 완성도(0~100 정수 %). 기준 미만이면 confirm_handover도 C
[[rules]]
key = "handover_completeness"
action = "confirm_handover"
metric = "param"
field = "completeness_percent"
op = "<"
value = 80

# merge_pr: generate_pr와 같은 크기·경로 기준. 규칙 키는 파일 안에서 겹치지 않게 merge_ 접두사
[[rules]]
key = "merge_changed_lines"
action = "merge_pr"
metric = "param"
field = "changed_lines"
op = ">"
value = 300

[[rules]]
key = "merge_changed_files"
action = "merge_pr"
metric = "param"
field = "changed_files"
op = ">"
value = 20

[[rules]]
key = "merge_allowed_paths"
action = "merge_pr"
metric = "paths_within"
field = "changed_paths"
allowed = ["shop-api/", "shop-web/", "docs/"]

# 보호 경로: pr_protected_paths와 같은 목록. 값은 제안값
[[rules]]
key = "merge_protected_paths"
action = "merge_pr"
metric = "paths_avoid"
field = "changed_paths"
protected = [
  # shop-web (ax-frontend): 결제 화면, 로그인·인증, API 클라이언트, 환경값
  "shop-web/src/pages/Checkout.tsx",
  "shop-web/src/lib/auth.tsx",
  "shop-web/src/lib/api.ts",
  "shop-web/src/lib/env.ts",
