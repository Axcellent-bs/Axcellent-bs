[project]
name = "ax-workflow-testing"
version = "0.1.0"
description = "shared/workflow-testing — 기획·개발 두 서비스를 잇는 시험 도우미 (시험에서만 쓴다, 담당: 예진)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ax-agent-planning",
    "ax-agent-dev",
    "pytest>=8",
]

[tool.uv.sources]
ax-agent-planning = { workspace = true }
ax-agent-dev = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ax_workflow_testing"]
