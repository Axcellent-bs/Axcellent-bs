# 짧은 영상 형식 카드 라이브러리 (11/26 초안, 재현 님 검토 필요).
# 일반 형식만 적는다: 특정 영상·채널·실존 인물·남의 대사를 넣지 않는다.
# 읽기: ax_agent_template.format_cards (표준 라이브러리 tomllib). 형식 검사는 load_cards가 한다.
#
# 칸
# - id: F-01… (겹치지 않게)
# - name: 형식 이름
# - beats: 구간 [이름, 비율]. 비율 합은 1. punch_beat = 펀치라인 구간 번호(0부터)
# - hook: 첫 1~2초에 붙잡는 방식
# - punchline: 펀치라인이 어디서 터지는지 (자막 · 표정 · 컷)
# - people: 화면에 나오는 사람 수 (0 = 손·사물만)
# - ai_difficulty: AI 영상으로 만들기 (쉬움 · 보통 · 어려움)
# - audio_names: 인스타 인기 오디오 이름 "Reels Sound - <형식>"의 <형식>과 맞춰 볼 이름 (형식 신호)
# - note: 한 줄 설명

[[cards]]
id = "F-01"
name = "POV"
beats = [["POV 자막", 0.15], ["상황", 0.55], ["리액션", 0.15], ["엔드카드", 0.15]]
punch_beat = 2
hook = "첫 화면 자막으로 'POV: ~한 나'를 보여 주고 바로 상황으로"
punchline = "표정"
people = 1
ai_difficulty = "쉬움"
audio_names = ["POV"]
note = "1인칭 시점. 손·책상·화면 위주라 인물 일관성 부담이 적다"

