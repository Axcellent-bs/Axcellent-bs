[project]
name = "ax-workflow-core"
version = "0.1.0"
description = "shared/workflow-core — 기획·개발 서비스가 같이 쓰는 상태 모델·저장·적용 틀 (담당: 예진)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ax-contracts",
    "ax-agent-template",
    "pydantic>=2.7",
    "fastapi>=0.115",
]

[tool.uv.sources]
ax-agent-template = { workspace = true }
ax-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ax_workflow"]
