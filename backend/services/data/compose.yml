services:
  data:
    build:
      context: ../..
      dockerfile: services/data/Dockerfile
    ports:
      - "127.0.0.1:8106:8106"
    env_file:
      - path: ../../.env
        required: false
      - path: ./.env
        required: false
    environment:
      # 검색어 급상승(trend_scan) 기본 키워드 그룹. 이미지에 backend/가 /app으로 들어간다(COPY . .)
      # 회사는 AX_TENANT, 없으면 회사 연결에서 고른 회사(캣북스 기본값 없음, 비우면 서비스가 회사 폴더에서 찾는다).
      # 바꾸려면 셸 환경변수 DATA_TREND_CONFIG·AX_TENANT로 준다
      # (env_file .env에 적은 값은 이 줄에 덮인다)
      # 이 블록은 scripts/split_services.py가 만드는 파일에 손으로 넣었다. 스크립트를 다시 돌리면 빠진다
      DATA_TREND_CONFIG: ${DATA_TREND_CONFIG:-}
