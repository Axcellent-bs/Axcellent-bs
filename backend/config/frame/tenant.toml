# 틀 기본값: 회사 설정 폴더(config/tenants/<회사>)가 없는 회사가 쓰는 공통 설정 (11/25).
#
# 가입하면 회사 공간이 바로 생기고, 서버 주소를 넣으면 대시보드가 채워져야 한다(고객사가 채우는 빈칸은
# 서버 주소·AI 키·회사 이름 셋). 그래서 회사마다 폴더를 손으로 만들지 않고, 캣북스가 아닌 회사에
# 회사 설정이 정해지지 않았으면(ax_agent_template.tenant.current() 가 None) 이 파일을 쓴다.
# - 캣북스와 회사 설정이 정해진 회사는 이 파일을 보지 않는다
# - 회사 이름·소개·브랜드·키워드는 두지 않는다(회사 이름·연결된 서버 데이터에서 나오거나 틀 기본값)
# - 회사 목록(config/tenants)에 들어가지 않아 화면에서 회사 설정으로 고를 수 없다
# 비밀값을 두지 않는다.

# data 지표 카탈로그: 사이트 변환기가 shop-api 규격으로 바꿔 주므로 모든 회사가 같은 지표
# (domains/data/src/data_agent/catalogs/common.toml)
catalog = "common"
connector = "shop-api"
# 업무 배정 틀(서비스 → 부서). 시드 인원 없음
org = "org.yaml"
# 요일·날짜 경계. 코드에 시간대를 두지 않는다
timezone = "Asia/Seoul"
