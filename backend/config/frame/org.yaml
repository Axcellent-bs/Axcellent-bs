  orchestrator: {unit: 서비스운영}
  planning: {unit: 기획팀}
  dev: {unit: 개발팀}
  incident: {unit: 서비스운영}
  hosts: {unit: 서비스운영}
  inquiry: {unit: 고객지원}
  claims: {unit: 고객지원}
  settlement: {unit: 고객지원}
  reviews: {unit: 고객지원}
  coupon: {unit: 마케팅}
  finance: {unit: 재무/정산}
  data: {unit: 데이터분석}
  handover: {unit: 인사총무}
  decisions: {unit: 인사총무}
  org: {unit: 인사총무}

  # skill 단위 (예시): 배포 롤백은 서비스운영이 아니라 개발팀 배포 담당이 맡는다
  rollback_deployment: {unit: 개발팀, assignee: 배포 담당}
