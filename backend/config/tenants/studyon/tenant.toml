# 스터디온에듀(가상 고객사, 온라인 강의 플랫폼) 회사 설정. 회사 한 곳 = 카탈로그 + 커넥터 + 조직도
# 스터디온에듀 설치에서 AX_TENANT=studyon 으로 쓴다(고객사별 설치, docs/superpowers/specs/2026-11-19-install-and-connection-architecture.md).
# 사이트 자기 API를 "다른 형식 API"(사이트 변환기)로 연결한다. 비밀값을 두지 않는다

name = "스터디온에듀"
# data 지표 카탈로그 (domains/data/src/data_agent/catalogs/studyon.toml)
catalog = "studyon"
# 사이트 변환기가 shop-api 규격으로 바꿔 주므로 커넥터는 shop-api
connector = "shop-api"
org = "org.yaml"
# 검색어 급상승·YouTube 키워드(trends.toml·youtube.toml)는 아직 없다. 교육 키워드는 사람이 정해 넣는다

timezone = "Asia/Seoul"

# 도메인 프로필(data domain_profile)이 읽는 회사 소개. 키워드·카테고리·출처는 적지 않는다(AI가 카탈로그로 고름)
[profile]
about = "스터디온에듀는 강의 영상·라이브·구독을 온라인으로 파는 강의 플랫폼이다."

[profile.override]
