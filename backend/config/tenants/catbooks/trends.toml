# 검색어 급상승(data trend_scan)이 기본으로 보는 키워드 그룹. 요청에 그룹이 없으면 이 목록을 본다
# run_all.sh가 tenant.toml의 trends로 이 파일을 찾아 DATA_TREND_CONFIG로 넘긴다 (scripts/tenant_env.py)
# 그룹마다 네이버 검색어 트렌드를 한 번씩 부른다(하루 한도 NAVER_DATALAB_DAILY_LIMIT). 키워드는 그룹당 20개까지

[[groups]]
name = "고양이"
keywords = ["고양이"]

[[groups]]
name = "고양이 책"
keywords = ["고양이 책", "고양이 도서", "고양이 그림책"]

[[groups]]
name = "책 추천"
keywords = ["책 추천", "도서 추천"]

[[groups]]
name = "그림책"
keywords = ["그림책"]

# YouTube 후보(data trend_candidates): 최신 YouTube 인기 영상 스냅샷의 태그에서 후보 키워드를 뽑아
# 후보마다 네이버 검색어 트렌드를 한 번씩 부른다(하루 한도 NAVER_DATALAB_DAILY_LIMIT). 그래서 후보 수는 작게 둔다
[candidates]
max_candidates = 5      # 후보 수 상한 (나온 영상 수 많은 순)
min_videos = 2          # 이 수 이상의 인기 영상에 붙은 태그만 후보
max_age_hours = 24      # 스냅샷이 이보다 오래되면 후보를 뽑지 않음 (unknown + 이유)
rep_videos = 3          # 근거로 보여 줄 대표 영상 id 수
# 너무 일반적인 태그 (정리한 뒤 값과 비교: 앞뒤 공백·# 제거, 영문 소문자)
exclude_tags = [
  "shorts", "쇼츠", "short", "브이로그", "vlog", "유튜브", "youtube",
  "게임", "game", "gaming", "스트리머", "방송", "생방송", "live", "bj",
  "치지직", "트위치", "twitch", "아프리카", "아프리카tv", "숲", "soop",
  "먹방", "일상", "funny", "웃긴영상", "예능", "music", "뮤직", "kpop", "k-pop",
]

# 별칭 표: 대표 이름 = [별칭…]. 태그 정리 다음에 별칭을 대표 이름으로 바꿔 한 후보로 센다
# (나온 영상 수는 영상 기준 중복 없이). 네이버는 대표 이름 그룹에 별칭들을 키워드로 함께 넣어 부른다.
# 이름·별칭 모두 정리한 값으로 적는다(영문 소문자). 별칭 하나는 대표 이름 하나에만
# 뜻이 여럿인 줄임말(롤·마크·메이플)은 넣지 않는다: 네이버 그룹에 넣으면 다른 뜻의 검색량이 섞인다
[candidates.aliases]
"리그오브레전드" = ["lol", "리그 오브 레전드", "league of legends"]
"t1" = ["티원"]
"페이커" = ["faker"]
"마인크래프트" = ["minecraft"]
"배틀그라운드" = ["배그", "pubg"]
"메이플스토리" = ["maplestory"]

# 영상 소재 추천(data content_recommend, 콘텐츠 루프 2단계): 기본 키워드 그룹(trend_scan)과 YouTube 후보
# (trend_candidates)에서 급상승한 것만 골라 점수 순으로 추천한다. 점수 = z_weight × z + (두 소스면 two_source_bonus)
[recommend]
max_items = 5            # 추천 수 상한. 급상승이 이보다 적으면 있는 만큼만(억지로 채우지 않음)
z_weight = 1.0           # 변화 정도(z) 가중치
two_source_bonus = 2.0   # 검색 급상승 + YouTube 인기 태그 근거가 둘 다 있으면 더하는 점수
# 회사 관련성 표시용 키워드 (위 기본 키워드 그룹의 이름·키워드는 자동으로 포함). 순위에서 빼지는 않는다
company_keywords = ["책", "도서", "출판", "캣북스", "반려묘", "집사"]
# 회사 소개 한두 줄 (무엇을 파는지, 고객). 아이디어 문장 프롬프트에 넣어 구체적으로 쓰게 한다.
# 상품은 지금 쇼핑몰(shop-api)에 있는 것만 적는다
company_intro = "캣북스는 여러 판매자가 책(프로그래밍 입문서·데이터 분석서·에세이·소설)과 독서·필기 문구(노트·젤펜·만년필·독서대)를 파는 온라인 서점이다. 고객은 책과 문구를 사는 개인 고객이다."

# 월별 흐름(data trend_history): 기본 키워드 그룹을 네이버 월 단위로 본다. 판정은 하지 않고 값과
# "작년 같은 달 대비" 배수만 준다. 그룹마다 네이버 1번
[history]
months = 24   # 볼 개월 수 (작년 같은 달과 비교하려면 13개월 이상)

# YouTube 지금 속도(data youtube_velocity): 최근 두 스냅샷 사이 시간당 조회 증가가 큰 영상 몇 개를 보여 줄지.
# 판정은 하지 않는다 (스냅샷이 며칠 쌓이면 평소 속도와 비교한 판정을 붙일 예정)
[velocity]
top = 10

# 인기 검색어(data trend_candidates 후보 출처): Google Trends 공개 RSS 스냅샷(data trending_collect)에서
# 검색어를 후보로 쓴다. 정리·별칭·제외 규칙은 YouTube 태그와 같다. YouTube 후보와 이름이 겹치면 그 후보에
# 근거로 붙고, 겹치지 않는 것만 따로 후보(최대 max_candidates개)가 된다. 후보마다 네이버 1번
[trending]
geo = "KR"               # 지역 (피드 geo)
max_candidates = 5       # YouTube 후보와 겹치지 않는 인기 검색어 후보 수 상한 (피드 순위 순)
max_age_hours = 24       # 스냅샷이 이보다 오래되면 이 출처만 unknown + 이유
