# 캣북스 조직도: 업무 → 맡은 부서·담당자 (업무 요청 라우터, backend/README.md "업무 요청 라우터")
#
# 회사 설정 폴더(config/tenants/catbooks/)의 조직도다. 비밀값이 없어 커밋한다.
# 내 PC에서만 다르게 쓰려면 config/org.yaml(커밋 안 함)을 두거나 AX_ORG_CONFIG를 준다. 그쪽이 먼저다.
#
# 켜지 않은 서비스(AX_ENABLED_SERVICES에 없음)로 가는 요청은 여기 적힌 부서의 사람 할 일함으로 간다.
# - 키: 서비스 id(아래 14개, frontend/src/demo/services.ts 와 같다. 인수인계 handover는 화면에서 접어 services.ts에 없다) 또는 skill id
#   skill 줄이 있으면 서비스 줄보다 먼저 쓴다 (특정 업무만 다른 부서·담당자에게 보낼 때)
# - unit: 맡은 부서 (필수)
# - assignee: 담당자 (선택). 비우면 부서 할 일함에만 들어간다
# - 여기 없는 업무가 꺼진 서비스로 가면 지어내지 않고 실패(no_assignee)로 돌려준다
# 부서 이름은 이 파일에만 둔다. 코드에는 쓰지 않는다.

assignments:
  # 서비스 단위
  orchestrator: {unit: 서비스운영}
  planning: {unit: 기획팀}
  dev: {unit: 개발팀}
  incident: {unit: 서비스운영}
  hosts: {unit: 서비스운영}
  inquiry: {unit: 고객지원}
  claims: {unit: 고객지원}
  reviews: {unit: 고객지원}
  coupon: {unit: 마케팅}
  finance: {unit: 재무/정산}
  data: {unit: 데이터분석}
  handover: {unit: 인사총무}
  decisions: {unit: 인사총무}
  org: {unit: 인사총무}

  # skill 단위 (예시): 배포 롤백은 서비스운영이 아니라 개발팀 배포 담당이 맡는다
  rollback_deployment: {unit: 개발팀, assignee: 배포 담당}

# 기본 명부(예시): 우리 팀원 6명이 맡은 부서. 인사 AI 조직 변동 명부의 기본값이고, 재무 AI 팀 예산의
# 팀 인원(`team_headcount`)도 발령 기록이 확정되기 전에는 이 명부로 센다.
# - id: 직원 ID (이름은 쓰지 않는다). unit: 위 assignments에 있는 부서 이름과 같아야 한다 (없는 부서는 건너뛴다)
# - 한 사람은 한 부서에만 센다. 두 부서를 맡아도 주로 맡은 곳에 넣는다 (인사·총괄 → 인사총무, 기획·개발 → 기획팀)
# - 서비스운영·개발팀은 이 명부에서 0명이다
members:
  - {id: emp_01, unit: 인사총무}   # 인사 AI·총괄 담당
  - {id: emp_02, unit: 재무/정산}  # 재무 AI 담당
  - {id: emp_03, unit: 기획팀}     # 기획 AI·개발 AI 담당
  - {id: emp_04, unit: 데이터분석} # 데이터분석 AI 담당
  - {id: emp_05, unit: 고객지원}   # 고객지원 AI 담당
  - {id: emp_06, unit: 마케팅}     # 마케팅 AI 담당

# 업무 영역: 인사 AI 명부의 영역이다. 인사 AI가 시작할 때 읽어 명부에 없는 영역만 더한다 (담당자는 넣지 않는다).
# 기획 AI가 기획서 초안의 영역을 정할 때(domain/handover.py)와 같은 이름이어야 한다.
# 영문 소문자·숫자·'-'만 쓴다. 영역이 없으면 인사 AI의 check_plan이 UNKNOWN_AREA로 거절한다.
areas:
  - payment
  - search
  - catalog
  - support-desk
  - infra-ops
  - inventory
