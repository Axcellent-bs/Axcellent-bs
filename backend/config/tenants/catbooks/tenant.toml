# 회사 한 곳 = 카탈로그 + 커넥터 + 조직도 (backend/README.md "새 회사를 붙일 때")
# run_all.sh가 AX_TENANT(기본 catbooks)로 이 폴더를 읽는다 (scripts/tenant_env.py)
# 비밀값을 두지 않는다. 토큰·주소는 backend/.env 에만 둔다

name = "캣북스"
# data 지표 카탈로그: 이름이면 domains/data/src/data_agent/catalogs/<이름>.toml, .toml이면 이 폴더 기준 경로
catalog = "catbooks"
# 커넥터 이름. 카탈로그의 connector와 같아야 한다 (data clients/shop_client.py CONNECTORS)
connector = "shop-api"
# 조직도 (이 폴더 기준). 꺼진 서비스로 가는 일을 맡는 부서
org = "org.yaml"
# 검색어 급상승(data trend_scan) 기본 키워드 그룹 (이 폴더 기준)
trends = "trends.toml"
# YouTube 영상 통계 스냅샷이 검색하는 회사 키워드 (이 폴더 기준)
youtube = "youtube.toml"

# 회사 시간대 (요일·날짜 경계: campaign_effect 같은 요일 기준선, 시작 전 기록 일수). IANA 이름
timezone = "Asia/Seoul"

# 도메인 프로필(data domain_profile)이 읽는 회사 소개. 키워드·카테고리·출처는 적지 않는다(AI가 카탈로그로 고름)
[profile]
about = "캣북스는 책을 파는 온라인 쇼핑몰(이커머스)을 운영하는 출판사다. 직접 펴낸 책과 함께 소설·에세이·IT 학습서를 판매한다."

# 사람이 덮어쓰기 (비어 있어도 됨). 쓸 수 있는 칸: industry, customer_axes, subtopic_axes, questions,
# seed_keywords(더할 키워드), drop_keywords(뺄 키워드)
[profile.override]

# 새 데이터 출처 수집 승인 (사람). data_sources의 출처 id를 적으면 수집을 시작한다.
# 기존 출처(youtube·google_trending·naver_search_trend)는 적지 않아도 승인된 것으로 본다
[sources]
# 새 출처는 사람이 승인해야 수집 계획·기회 카드가 부른다 (2026-11-05 쇼핑인사이트 이용 신청 후 승인)
approved = ["naver_shopping"]

# 홍보 영상 브랜드 (기획 영상 제작안·마케팅 영상 프롬프트). 모두 선택, 영문 120자·한글 60자 안.
# 글자·실존 인물·실제 브랜드·숫자는 쓰지 않는다(걸리면 그 칸은 기본값)
[brand]
# 캐릭터·배경은 의뢰에서 고른 캐릭터(CR)나 기본값을 쓴다(11/24). 회사 고정 마스코트를 두려면 다시 적는다.
style_en = "flat illustration style, soft natural light"
# 홍보 영상 방향 (11/24, 선택). promo_style: fun_first(재미 먼저, 브랜드는 끝에) · product(제품·업종 소개)
# brand_exposure(재미 먼저일 때): end_card(마지막 2~3초 채널 이름·로고) · prop(화면 속 소품) · caption(캡션·프로필에만)
# 시스템 관리 › 회사 연결 › 브랜드에서 저장한 값이 있으면 그것이 먼저다. 없으면 fun_first · end_card
promo_style = "fun_first"
brand_exposure = "end_card"
# SNS 게시 초안 (11/24, 선택). hashtags: 늘 붙는 브랜드 태그(# + 한글·영문·숫자·밑줄). 없으면 "#" + 회사 이름(공백 뺌)
# demo_notice: 캡션에 늘 넣는 시연 안내 한 줄(가상 회사만). 없으면 넣지 않는다
hashtags = ["#캣북스"]
demo_notice = "캣북스는 시연용 가상 서비스이며 실제 거래·배송이 없습니다."
# 마케팅 미디어 추천의 분류 (11/24, 선택). 기획안 글에 이 말이 있으면 장면 템플릿 category로 추천한다.
# 없으면 분류는 늘 미정(지어내지 않음). 긴 말이 짧은 말보다 먼저 맞는다(예: "그림책"이 "책"보다)
categories = [
  "자기계발", "그림책", "동화책", "에세이", "참고서", "문제집", "만화", "웹툰", "소설", "시집",
  "동화", "인문", "과학", "역사", "경제", "경영", "요리", "여행", "육아", "예술", "철학", "추리",
  "판타지", "로맨스", "수험서", "어린이책",
]
# 데이터 홍보 영상 아이디어 (11/24, 선택). 한글·영문만(숫자 없음), 단어 20자·장면 30자 안.
# promo_words: 아이디어 한 줄에 하나는 있어야 하는 회사 소재(회사 이름·카탈로그 품목·분류는 따로 더해진다)
# promo_scenes: 고정 틀 "{형식}으로 {회사 이름}의 {장면} 보여 주기"의 형식별 장면, promo_scene: 그 밖 형식.
# 없으면 [brand] 배경·주인공과 카탈로그 품목 이름으로 만든 중립 장면
promo_words = ["책", "독서", "서점"]
promo_scene = "책 읽는 장면"

[brand.promo_scenes]
"챌린지" = "책 한 권 끝까지 읽기 도전"
"상황극·스케치" = "서점에서 책 고르는 장면"
"리액션" = "책 속 반전을 읽는 순간의 표정"
"정보·팁" = "책 고르는 요령"
"비포애프터" = "책 읽기 전과 후의 책상"
"브이로그" = "하루 독서 시간"
"밈 패러디" = "책 읽는 고양이 장면"

[finance]
# 팀 예산 = 그달 1일 팀 인원 × 인당 월 단가(원). 재무 AI가 계산하고 재무 담당이 승인한다
per_head_monthly = 100000

# 인스타 게시 계정 (data 의뢰 영상 성과: business_discovery로 이 계정의 최근 50개에서 우리 게시물을 찾는다).
# 값은 사람이 넣는다 (@ 없이 아이디). 없으면 의뢰 영상 성과는 "회사 설정에 게시 계정 아이디가 없음"
# 11/23 새 서버의 게시 계정(MARKETING_IG_USER_ID가 가리키는 계정)을 Graph 읽기로 확인해 넣었다.
[instagram]
publish_username = "catbooks.lab"
