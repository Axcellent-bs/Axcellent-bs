# 조직도: 업무 → 맡은 부서·담당자 (업무 요청 라우터, backend/README.md "업무 요청 라우터")
#
# 회사 조직도는 config/tenants/<회사>/org.yaml 에 둔다(캣북스는 커밋됨, README "새 회사를 붙일 때").
# 내 PC에서만 덮어쓰려면 이 파일을 org.yaml 로 복사해서 고친다. org.yaml 은 커밋하지 않고(.gitignore) 회사 폴더보다 먼저 쓰인다.
#   cp config/org.example.yaml config/org.yaml
#
# 켜지 않은 서비스(AX_ENABLED_SERVICES에 없음)로 가는 요청은 여기 적힌 부서의 사람 할 일함으로 간다.
# - 키: 서비스 id(아래 13개, frontend/src/demo/services.ts 와 같다) 또는 skill id
#   skill 줄이 있으면 서비스 줄보다 먼저 쓴다 (특정 업무만 다른 부서·담당자에게 보낼 때)
# - unit: 맡은 부서 (필수)
# - assignee: 담당자 (선택). 비우면 부서 할 일함에만 들어간다
# - 여기 없는 업무가 꺼진 서비스로 가면 지어내지 않고 실패(no_assignee)로 돌려준다
# 부서 이름은 이 파일에만 둔다. 코드에는 쓰지 않는다.

assignments:
  # 서비스 단위
  orchestrator: {unit: 서비스운영}
  planning: {unit: 기획팀}
  dev: {unit: 개발팀}
  incident: {unit: 서비스운영}
  hosts: {unit: 서비스운영}
  inquiry: {unit: 고객지원}
  claims: {unit: 고객지원}
  reviews: {unit: 고객지원}
  coupon: {unit: 마케팅}
  finance: {unit: 재무/정산}
  data: {unit: 데이터분석}
  handover: {unit: 인사총무}
  decisions: {unit: 인사총무}

  # skill 단위 (예시): 배포 롤백은 서비스운영이 아니라 개발팀 배포 담당이 맡는다
  rollback_deployment: {unit: 개발팀, assignee: 배포 담당}
