# uv workspace 루트 (가상 루트: 자체 패키지 없음)
[tool.uv.workspace]
# shared: 공통 계약·템플릿·안전 레이어·중계 / domains: 업무 로직(원래 부서 패키지) / services: 서비스 13개
members = [
    "shared/*",
    "domains/*",
    "services/*",
]
exclude = ["services/hosts"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "import-linter>=2.1",
    "fakeredis>=2.23",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["shared/*/src", "domains/*/src", "services/*/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
# 패키지마다 tests/test_smoke.py 이름이 겹쳐서 importlib 모드를 쓴다
addopts = "--import-mode=importlib"
testpaths = [
    "shared",
    "domains",
    "services",
]
asyncio_default_fixture_loop_scope = "function"
