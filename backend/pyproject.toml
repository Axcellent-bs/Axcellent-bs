# uv workspace 루트 (가상 루트: 자체 패키지 없음)
[tool.uv.workspace]
# shared: 공통 계약·템플릿·안전 레이어·중계 / domains: 업무 로직(원래 부서 패키지) / services: 서비스 13개
members = [
    "shared/*",
    "domains/*",
    "services/*",
]
exclude = ["services/hosts"]

[tool.uv]
# CVE-2026-126360(traceparent 정규식 DoS). FastAPI가 끌고 오는 간접 의존성. FastAPI가 1.45.2 이상을 요구하면 이 줄 삭제
constraint-dependencies = ["opentelemetry-api>=1.45.2"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "import-linter>=2.1",
    "fakeredis>=2.23",
    "pytest-xdist>=3.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["shared/*/src", "domains/*/src", "services/*/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
# 패키지마다 tests/test_smoke.py 이름이 겹쳐서 importlib 모드를 쓴다
# CPU 수만큼 나눠 돌린다(pytest-xdist). worksteal: 먼저 끝난 워커가 남은 시험을 나눠 가져가
# 느린 파일 하나가 끝을 붙잡지 않는다. 한 프로세스로 돌리려면 `-n 0`.
# 끝에 가장 느린 시험 20개를 찍는다(CI 시간 확인용, 1초 미만은 뺀다)
addopts = "--import-mode=importlib -n auto --dist worksteal --durations=20 --durations-min=1"
testpaths = [
    "shared",
    "domains",
    "services",
    "tests",  # 서비스 여러 개를 함께 도는 시나리오 테스트 (backend/tests/scenarios)
]
asyncio_default_fixture_loop_scope = "function"
markers = [
    "eval: data 정확도 평가를 실제로 돌리는 느린 테스트 (CI data-eval job에서만 돈다)",
]
